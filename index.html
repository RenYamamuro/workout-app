const MAX_HISTORY_ROWS = 30;

// 推定1RMの推移（折れ線）。古い順に並べ、日付の間隔をそのまま横軸に反映する
function trendHTML(rows) {
  const pts = rows.filter(r => r.est !== null).slice(0, MAX_HISTORY_ROWS).reverse()
    .map(r => ({ v: r.est, t: new Date(r.date + "T00:00:00").getTime(), date: r.date }));
  if (pts.length < 2) return "";

  const W = 320, H = 112, L = 10, R = 310, TOP = 22, BOT = 84;
  const vs = pts.map(p => p.v);
  const lo0 = Math.min(...vs), hi0 = Math.max(...vs);
  const pad = Math.max((hi0 - lo0) * 0.18, 1);
  const lo = lo0 - pad, hi = hi0 + pad;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const x = (p, i) => t1 === t0 ? L + (R - L) * i / (pts.length - 1) : L + (R - L) * (p.t - t0) / (t1 - t0);
  const y = v => BOT - (v - lo) / (hi - lo) * (BOT - TOP);
  const xy = pts.map((p, i) => [x(p, i), y(p.v)]);

  const line = xy.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const area = line + " L" + xy[xy.length - 1][0].toFixed(1) + " " + BOT + " L" + xy[0][0].toFixed(1) + " " + BOT + " Z";
  const md = d => { const [, m, dd] = d.split("-"); return Number(m) + "/" + Number(dd); };
  const fmt = v => (Math.round(v * 10) / 10) + "kg";
  const lastI = pts.length - 1;
  const maxI = vs.indexOf(hi0);

  // 値のラベル：最初・最後・最大（最大が最後と同じなら重ねない）
  const label = (i, cls) => {
    const [cx, cy] = xy[i];
    const anchor = i === 0 ? "start" : i === lastI ? "end" : "middle";
    // 端の点は、隣の点が上にあるときは線とぶつからないよう下に、そうでなければ上に置く
    const nb = i === 0 ? xy[1] : i === lastI ? xy[lastI - 1] : null;
    const below = nb ? nb[1] < cy - 2 : false;
    const ty = below ? cy + 17 : (cy - 8 < 12 ? cy + 17 : cy - 8);
    return '<text class="t-val ' + (cls || "") + '" x="' + cx.toFixed(1) + '" y="' + ty.toFixed(1) +
           '" text-anchor="' + anchor + '">' + fmt(pts[i].v) + '</text>';
  };
  let labels = label(0) + label(lastI, "last");
  if (maxI !== 0 && maxI !== lastI) labels += label(maxI, "best");

  const dots = xy.map((c, i) =>
    '<circle class="t-dot' + (i === lastI ? " last" : "") + '" cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) +
    '" r="' + (i === lastI ? 4 : 3) + '"/>').join("");

  const delta = pts[lastI].v - pts[0].v;
  const pct = pts[0].v ? Math.round(delta / pts[0].v * 1000) / 10 : 0;
  const sign = delta > 0 ? "+" : "";
  const summary =
    '<div class="trend-sum"><span>' + t("推定1RM") + '</span><b>' + fmt(pts[0].v) + ' → ' + fmt(pts[lastI].v) + '</b>' +
    '<span class="' + (delta > 0 ? "up" : "") + '">' + sign + (Math.round(delta * 10) / 10) + 'kg（' + sign + pct + '%）</span></div>';

  return '<div class="trend">' + summary +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t("推定1RMの推移 {a}から{b}", { a: fmt(pts[0].v), b: fmt(pts[lastI].v) }) + '">' +
    '<line class="t-grid" x1="' + L + '" x2="' + R + '" y1="' + TOP + '" y2="' + TOP + '"/>' +
    '<line class="t-base" x1="' + L + '" x2="' + R + '" y1="' + BOT + '" y2="' + BOT + '"/>' +
    '<path class="t-area" d="' + area + '"/><path class="t-line" d="' + line + '"/>' + dots + labels +
    '<text class="t-tick" x="' + L + '" y="104" text-anchor="start">' + md(pts[0].date) + '</text>' +
    '<text class="t-tick" x="' + R + '" y="104" text-anchor="end">' + md(pts[lastI].date) + '</text>' +
    '</svg></div>';
}

function drawModalHistory() {
  const box = document.getElementById("modalHistory");
  const trendBox = document.getElementById("modalTrend");
  const rows = exerciseHistory(modalExercise.name);
  box.innerHTML = "";
  trendBox.innerHTML = "";

  const heading = document.createElement("h4");
  heading.textContent = t("この種目の記録");
  box.appendChild(heading);

  if (rows.length === 0) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.style.margin = "0";
    empty.textContent = t("まだ記録がありません。");
    box.appendChild(empty);
    return;
  }

  const bestValue = Math.max(...rows.map(r => r.est || 0));

  const chart = trendHTML(rows);
  if (chart) trendBox.innerHTML = chart;

  rows.slice(0, MAX_HISTORY_ROWS).forEach(row => {
    const isBest = row.est !== null && row.est === bestValue;
    const el = document.createElement("div");
    el.className = "hist-row" + (isBest ? " best" : "");
    el.innerHTML =
      '<span class="d">' + formatDate(row.date) + '</span>' +
      '<span class="v">' + formatSets(row.sets) + '</span>' +
      '<span class="e">' + (row.est !== null ? row.est + "kg" + (isBest ? " ★" : "") : "") + '</span>';
    box.appendChild(el);
  });

  const footer = document.createElement("p");
  footer.className = "muted";
  footer.style.margin = "8px 0 0";
  footer.textContent = rows.length > MAX_HISTORY_ROWS
    ? t("右端は推定1RM。★が自己ベスト。直近{n}件を表示（全{a}件）", { n: MAX_HISTORY_ROWS, a: rows.length })
    : t("右端は推定1RM。★が自己ベストです。");
  box.appendChild(footer);
}
function closeModal() {
  const sheet = modal.querySelector(".modal-card");
  sheet.style.transform = "";      // 引いて閉じた場合は、引いた位置から下へ滑り出す
  sheet.style.transition = "";
  modal.classList.add("closing");
  const finish = () => {
    modal.hidden = true;
    modal.classList.remove("closing");
    sheet.style.removeProperty("--drag");
    modalExercise = null;
  };
  // アニメーションを切っている環境では animationend が来ないので保険をかける
  const timer = setTimeout(finish, 700);
  modal.addEventListener("animationend", () => { clearTimeout(timer); finish(); }, { once: true });

// 取っ手を下へ引くと、指についてきて、一定以上引いて離すと閉じる
(() => {
  const grab = document.getElementById("sheetGrab");
  const sheet = modal.querySelector(".modal-card");
  let startY = null, dy = 0;
  grab.addEventListener("pointerdown", e => {
    startY = e.clientY; dy = 0;
    try { grab.setPointerCapture(e.pointerId); } catch (err) {}
    sheet.style.transition = "none";
  });
  grab.addEventListener("pointermove", e => {
    if (startY === null) return;
    dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = "translateY(" + dy + "px)";
  });
  const release = () => {
    if (startY === null) return;
    startY = null;
    if (dy > 100) {
      sheet.style.setProperty("--drag", dy + "px");
      dismissModal();
    } else {
      sheet.style.transition = "transform .25s var(--ease)";
      sheet.style.transform = "";
    }
  };
  grab.addEventListener("pointerup", release);
  grab.addEventListener("pointercancel", release);
})();

// 選んだ画像を縮小してから localStorage に保存する（そのままだと容量を超える）
photoInput.onchange = () => {
  const file = photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 640;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

      const photos = loadPhotos();
      photos[modalExercise.name] = canvas.toDataURL("image/jpeg", 0.7);
      localStorage.setItem(DELETED_PHOTO_KEY,
        JSON.stringify(loadDeletedPhotos().filter(n => n !== modalExercise.name)));
      if (savePhotos(photos)) {
        drawModal();
        drawExercises();
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = ""; // 同じ写真を選び直せるようにリセット
};

photoDelete.onclick = () => {
  const photos = loadPhotos();
  markPhotoDeleted(modalExercise.name);
  delete photos[modalExercise.name];
  savePhotos(photos);
  drawModal();
  drawExercises();
};

// ===== 履歴画面 =======================================================
let historyFilter = "all";   // "all" / "A" / "B" / "C"
const openLogIds = new Set();   // 履歴で中身を開いている記録（最初は一番新しい1件だけ開く）
const historyFilterEl = document.getElementById("historyFilter");
for (const btn of historyFilterEl.children) {
  btn.onclick = () => { historyFilter = btn.dataset.hf; renderHistory(); };
}

// 直近8週の、週ごとの総挙上量（月曜はじまり）。今週を濃く、先週との差を見出しに出す
const VOL_WEEKS = 8;
function drawVolumeChart(logs) {
  const box = document.getElementById("volChart");
  box.hidden = logs.length === 0;
  if (box.hidden) return;

  const p = n => String(n).padStart(2, "0");
  const key = d => d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  const thisMon = new Date(startOfWeek() + "T00:00:00");
  const weeks = [];
  for (let i = VOL_WEEKS - 1; i >= 0; i--) {
    const from = new Date(thisMon); from.setDate(from.getDate() - i * 7);
    const to = new Date(from); to.setDate(to.getDate() + 7);
    const vol = logs.filter(l => l.date >= key(from) && l.date < key(to))
                    .reduce((v, l) => v + totalVolume(l.exercises), 0);
    weeks.push({ from, vol });
  }

  const now = weeks[weeks.length - 1].vol, prev = weeks[weeks.length - 2].vol;
  const diff = prev ? Math.round((now - prev) / prev * 100) : null;
  const W = 320, H = 118, TOP = 16, BOT = 96, gap = 8;
  const bw = (W - gap * (VOL_WEEKS - 1)) / VOL_WEEKS;
  const max = Math.max(...weeks.map(w => w.vol), 1);
  let bars = "";
  weeks.forEach((w, i) => {
    const h = w.vol ? Math.max(3, (BOT - TOP) * w.vol / max) : 0;
    const x = i * (bw + gap);
    const isNow = i === weeks.length - 1;
    bars += '<rect class="bar' + (isNow ? " now" : "") + '" x="' + x.toFixed(1) + '" y="' + (BOT - h).toFixed(1) +
            '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4"><title>' +
            (w.from.getMonth() + 1) + "/" + w.from.getDate() + " " + Math.round(w.vol).toLocaleString() + 'kg</title></rect>';
    if (isNow && w.vol) bars += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (BOT - h - 4).toFixed(1) +
                                '" text-anchor="middle">' + Math.round(w.vol / 100) / 10 + 't</text>';
    bars += '<text class="lbl" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' +
            (w.from.getMonth() + 1) + "/" + w.from.getDate() + '</text>';
  });

  box.innerHTML =
    '<div class="head"><b>' + t("週ごとの総挙上量") + '</b>' +
      '<span>' + t("今週") + ' ' + Math.round(now).toLocaleString() + 'kg' +
      (diff !== null ? ' <span class="' + (diff > 0 ? "up" : "") + '" style="margin:0">' +
        t("（先週比 {d}%）", { d: (diff > 0 ? "+" : "") + diff }) + '</span>' : '') + '</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t("週ごとの総挙上量") + '">' + bars + '</svg>';
}

function renderHistory() {
  excludeLogId = null;
  const container = document.getElementById("logList");
  container.innerHTML = "";
  const allLogs = sortedLogs();
  if (openLogIds.size === 0 && allLogs[0]) openLogIds.add(allLogs[0].id);
  const logs = historyFilter === "all" ? allLogs : allLogs.filter(l => l.menu === historyFilter);

  for (const btn of historyFilterEl.children) {
    btn.classList.toggle("on", btn.dataset.hf === historyFilter);
  }
  document.getElementById("historyFilterRow").hidden = (allLogs.length === 0);
  document.getElementById("historyHint").hidden = (logs.length === 0);
  drawVolumeChart(logs);
  if (logs.length === 0) {
    container.innerHTML = '<p class="empty">' +
      (allLogs.length === 0 ? t("まだ記録がありません。") : t("{m} の記録はまだありません。", { m: menuName(historyFilter) })) + '</p>';
  }

  // 月ごとの回数と総挙上量（絞り込み後の記録で数える）
  const monthStats = {};
  for (const l of logs) {
    const key = l.date.slice(0, 7);
    const st = monthStats[key] || (monthStats[key] = { count: 0, volume: 0 });
    st.count++; st.volume += totalVolume(l.exercises);
  }

  let currentMonth = null;
  for (const log of logs) {
    const monthKey = log.date.slice(0, 7);
    if (monthKey !== currentMonth) {
      currentMonth = monthKey;
      const [y, m] = monthKey.split("-");
      const st = monthStats[monthKey];
      const mh = document.createElement("div");
      mh.className = "month-head";
      const mon = "JanFebMarAprMayJunJulAugSepOctNovDec".substr((Number(m) - 1) * 3, 3);
      mh.innerHTML = '<b>' + t("{y}年{m}月", { y, m: Number(m), mon }) + '</b>' +
        '<span>' + t("{n}回", { n: st.count }) + ' · ' + st.volume.toLocaleString() + 'kg</span>';
      container.appendChild(mh);
    }

    const card = document.createElement("div");
    card.className = "card log-card" + (openLogIds.has(log.id) ? " open" : "");

    // 見出し：日付・メニューと、時刻・種目数・総重量。タップで中身を開閉する
    const head = document.createElement("div");
    head.className = "log-head";
    const time = formatTime(log.savedAt);
    const editedTime = formatTime(log.editedAt);
    const meta = [
      time ? time + (editedTime ? t("（編集 {t}）", { t: editedTime }) : "") : "",
      t("{n}種目", { n: log.exercises.length }),
      totalVolume(log.exercises).toLocaleString() + "kg"
    ].filter(Boolean).join(" · ");
    head.innerHTML =
      '<span class="t"><b>' + formatDate(log.date) + ' ' + menuName(log.menu) + '</b>' +
      '<span class="log-time">' + meta + '</span></span>';
    head.onclick = e => {
      if (e.target.closest("button")) return;
      const open = card.classList.toggle("open");
      if (open) openLogIds.add(log.id); else openLogIds.delete(log.id);
    };

    // 編集：内容を直して保存し直す（間違えて保存してしまったときの修正用）
    const edit = document.createElement("button");
    edit.className = "log-del";
    edit.innerHTML = icon("edit");
    edit.title = t("この記録を編集");
    edit.setAttribute("aria-label", t("この記録を編集"));
    edit.onclick = () => renderWorkout(log.menu, log);
    head.appendChild(edit);

    // 削除は破壊的な操作なので、常時目立つ位置には置かない
    const del = document.createElement("button");
    del.className = "log-del log-trash";
    del.innerHTML = icon("trash");
    del.title = t("この記録を削除");
    del.setAttribute("aria-label", t("この記録を削除"));
    del.onclick = () => {
      if (!confirm(t("{d} の記録を削除しますか？", { d: formatDate(log.date) }))) return;
      markDeleted(log.id);
      saveLogs(loadLogs().filter(l => l.id !== log.id));
      renderHistory();
    };
    head.appendChild(del);
    head.insertAdjacentHTML("beforeend", '<span class="log-chev">' + icon("chev") + '</span>');
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "log-body";
    for (const ex of log.exercises) {
      const line = document.createElement("div");
      const name = document.createElement("button");
      name.textContent = exName(ex.name);
      name.title = t("この種目の記録を見る");
      name.onclick = () => openArtModal(findExerciseDef(ex.name));
      line.appendChild(name);
      const sets = document.createElement("span");
      sets.className = "sets";
      sets.textContent = formatSets(ex.sets);
      line.appendChild(sets);
      body.appendChild(line);
    }
    card.appendChild(body);

    if (log.memo) {
      const memo = document.createElement("div");
      memo.className = "log-memo";
      memo.textContent = t("メモ：") + log.memo;
      card.appendChild(memo);
    }

    container.appendChild(card);
  }
  goTo({ s: "history" });
  showScreen("history", t("履歴"));
}

// ===== 起動 ===========================================================
// 更新が端末に届いたかを確認するための版数。デプロイのたびに上げる。
const APP_VERSION = "2026-10-30.2";
document.getElementById("appVersion").textContent = APP_VERSION;

// ===== 保存忘れの通知 ==================================================
// アプリを開いている間だけ働く（完全に閉じている1時間には気づけない）。
// iOS Safari は Notification コンストラクタ未対応のため、必ず Service Worker 経由で出す。
const REMINDER_KEY = "workout-reminder-v1";
const REMINDER_INTERVAL_MS = 5 * 60 * 1000;   // 5分おきに確認する
const REMINDER_AFTER_MS = 60 * 60 * 1000;     // 1時間

function loadReminderSetting() {
  return localStorage.getItem(REMINDER_KEY) === "on" ? "on" : "off";
}

async function notifyUnsaved(wip) {
  const body = t("{m} の記録が、{e}から保存されていません。", { m: menuName(wip.draft.menu), e: formatElapsed(wip.updatedAt) });
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(t("保存忘れはありませんか？"), {
      body, tag: "workout-unsaved", icon: "icons/icon-192-v3.png"
    });
  } catch (e) {
    // Service Worker が使えない環境向けの保険（デスクトップ版Chromeなど）
    if ("Notification" in window) new Notification(t("保存忘れはありませんか？"), { body });
  }
}

function checkReminder() {
  if (loadReminderSetting() !== "on") return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const wip = loadPersistedDraft();
  if (!wip) return;
  if (Date.now() - new Date(wip.updatedAt).getTime() < REMINDER_AFTER_MS) return;
  if (localStorage.getItem(REMINDER_NOTIFIED_KEY) === wip.updatedAt) return;   // 同じ下書きには一度だけ
  notifyUnsaved(wip);
  localStorage.setItem(REMINDER_NOTIFIED_KEY, wip.updatedAt);
}

const reminderSwitch = document.getElementById("reminderSwitch");
const reminderNote = document.getElementById("reminderNote");

function drawReminderSeg() {
  const value = loadReminderSetting();
  reminderSwitch.setAttribute("aria-checked", String(value === "on"));
  if (!("Notification" in window)) {
    reminderNote.textContent = t("このブラウザは通知に対応していません。");
  } else if (Notification.permission === "denied") {
    reminderNote.textContent = t("通知がブロックされています。ブラウザの設定から許可してください。");
  } else if (value === "on") {
    reminderNote.textContent =
      t("最後に入力してから1時間、保存されていなければ通知します。アプリを開いている間だけ働くので、完全に閉じた場合は気づけません。");
  } else {
    reminderNote.textContent = t("オンにすると、保存を忘れたまま1時間経ったときに通知します。");
  }
}

reminderSwitch.onclick = async () => {
  if (loadReminderSetting() === "on") {
    localStorage.setItem(REMINDER_KEY, "off");
    drawReminderSeg();
    return;
  }
  if (!("Notification" in window)) { drawReminderSeg(); return; }
  const perm = Notification.permission === "granted"
    ? "granted" : await Notification.requestPermission();
  if (perm === "granted") {
    localStorage.setItem(REMINDER_KEY, "on");
    checkReminder();
  }
  drawReminderSeg();
};

// ===== 言語の切り替え ==================================================
const langSeg = document.getElementById("langSeg");
function applyLang(setting) {
  if (setting === "auto") localStorage.removeItem(LANG_KEY);
  else localStorage.setItem(LANG_KEY, setting);
  LANG = resolveLang(setting);
  for (const btn of langSeg.children) btn.classList.toggle("on", btn.dataset.langValue === setting);
  translateStatic();
}
for (const btn of langSeg.children) {
  btn.onclick = () => {
    applyLang(btn.dataset.langValue);
    // 今の画面を作り直して、動的な文言も切り替える
    drawReminderSeg();
    requestPersistentStorage();
    renderState(currentState.s === "modal" ? { s: currentState.under } : currentState);
    window.dispatchEvent(new Event("langchange"));
  };
}

// ===== 起動 ===========================================================
applyLang(loadLangSetting());
applyTheme(loadTheme());

// 入力途中で完全終了しても、次に開いたときに続きから入力できるようにする
const restoredWip = loadPersistedDraft();
if (restoredWip) draft = reconcileDraft(restoredWip.draft);

history.replaceState({ s: "home" }, "");
renderHome();
drawReminderSeg();
requestPersistentStorage();
setInterval(checkReminder, REMINDER_INTERVAL_MS);
checkReminder();

// オフラインでも開けるようにする（file:// で開いた場合は登録できないので黙って諦める）
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
