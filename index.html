<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="description" content="PUSH / PULL / LEG の3分割メニューのトレーニング記録アプリ">
<!-- ホーム画面に追加したときの挙動（iOS / Android / デスクトップ） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LIFT LOG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="fonts/zen.css">
<!-- iOS はホーム画面のアイコンを強くキャッシュするので、差し替えるときは
     ファイル名ごと変える（-v2）。サイズ指定つきも併記して確実に拾わせる -->
<link rel="apple-touch-icon" href="icons/icon-180-v3.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180-v3.png">
<link rel="icon" href="icons/icon-192-v3.png" sizes="192x192" type="image/png">
<title>LIFT LOG</title>
<script>
  // 表示テーマは描画前に当てる。あとから当てると一瞬ちらつくため。
  try {
    var saved = localStorage.getItem("workout-theme-v1");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<style>
/* 文字は「Apple の端末では Apple 純正の丸い書体、それ以外は同梱の丸い書体」。
   サブスク・固定費マネージャーと同じ指定（フォントのファイルも fonts/ にコピーしてある）。
   - 日本語：Apple 端末のヒラギノ丸ゴを、日本語の範囲だけに限定した別名で先に当てる。
   - 欧文・数字：Safari では ui-rounded（SF Pro Rounded）。対応しないブラウザは Nunito。
   - Apple 以外：local() が見つからないので Nunito ＋ Zen Maru Gothic（fonts/zen.css）に落ちる。
   ヒラギノ丸ゴは W4 しかないので 400 だけを宣言し、太字はブラウザの合成に任せる。 */
@font-face {
  font-family: "JP Rounded";
  font-style: normal;
  font-weight: 400;
  src: local("Hiragino Maru Gothic ProN W4"), local("HiraMaruProN-W4"),
       local("Hiragino Maru Gothic Pro W4"), local("HiraMaruPro-W4");
  unicode-range: U+3000-30FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF, U+203B;
}
@font-face {
  font-family: "Nunito";
  font-style: normal;
  font-weight: 400 800;          /* 可変フォント。数字が最初から等幅 */
  font-display: swap;
  src: url("fonts/nunito-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
    U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
    U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ==========================================================================
   設計の約束（サブスク・固定費マネージャーと共通。iOS 純正風・柔らかめ）
   - 色は iOS のシステムカラーの考え方：灰色の地（グループ背景）に白い板、線は半透明の灰、
     文字は黒／灰の段階。アクセントだけアプリ固有のラベンダー
   - 余白は 4 の倍数（--s1..--s8）、文字は 6 段階（--t-xs..--t-2xl）＋大見出し --t-title
   - 角丸：--r-sm / --r-md / --r-lg / --r-sheet ＋丸型 --r-pill
   - すりガラス（--glass）はタブバー・サイドバー・スクロール時のバーだけに使う
   - 文字はすべて 4.5:1 以上（iOS の二次ラベルの灰は薄すぎるので一段濃くしている）
   ========================================================================== */
:root {
  color-scheme: light;

  --bg: #f2f2f7;               /* systemGroupedBackground */
  --panel: #ffffff;
  --panel-2: #f2f2f7;
  --fill: rgba(120, 120, 128, .12);       /* スイッチの地・入力の地など */
  --line: rgba(60, 60, 67, .14);
  --line-strong: rgba(60, 60, 67, .24);
  --hover: rgba(120, 120, 128, .08);
  --press: rgba(120, 120, 128, .16);

  --ink: #000000;
  --ink-2: #3c3c43;
  --ink-3: #6c6c70;

  --accent: #6b5dc8;           /* 白地 5.22:1 */
  --accent-ink: #ffffff;
  --accent-btn: #6b5dc8;
  --accent-wash: rgba(107, 93, 200, .10);
  --good: #17692f;
  --good-wash: color-mix(in srgb, var(--good) 12%, transparent);
  --warn: #9a4a00;
  --crit: #d70015;
  --crit-wash: rgba(255, 59, 48, .10);

  --series-1: #7c6fd6;
  --series-1-soft: #e2ddf7;

  --glass: rgba(249, 249, 252, .72);
  --glass-edge: rgba(255, 255, 255, .7);
  --glass-blur: saturate(180%) blur(24px);

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --t-xs: 11px; --t-sm: 13px; --t-md: 15px; --t-lg: 20px; --t-xl: 32px; --t-2xl: 48px;
  --t-title: 34px;             /* iOS の大きいタイトル */
  --r-sm: 10px; --r-md: 14px; --r-lg: 22px; --r-sheet: 28px; --r-pill: 999px;

  --shadow: 0 1px 2px rgba(0, 0, 0, .03);
  --shadow-pop: 0 24px 60px -12px rgba(0, 0, 0, .28), 0 0 0 .5px var(--line);
  --shadow-float: 0 10px 34px -8px rgba(0, 0, 0, .20), 0 0 0 .5px rgba(0, 0, 0, .06);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.32, .72, 0, 1);  /* iOS のシートに近い減速 */
  --fast: 160ms;
  --anim: 220ms;   /* 画面の切り替え。ここだけ変えれば全体の速さが変わる */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --panel: #1c1c1e;
    --panel-2: #2c2c2e;
    --fill: rgba(120, 120, 128, .24);
    --line: rgba(255, 255, 255, .10);
    --line-strong: rgba(255, 255, 255, .18);
    --hover: rgba(255, 255, 255, .06);
    --press: rgba(255, 255, 255, .12);
    --ink: #ffffff;
    --ink-2: #d1d1d6;
    --ink-3: #98989f;
    --accent: #a69df0;
    --accent-ink: #ffffff;
    --accent-btn: #6658cc;
    --accent-wash: rgba(157, 147, 236, .16);
    --good: #30d158;
    --warn: #ffb340;
    --crit: #ff6961;
    --crit-wash: rgba(255, 105, 97, .16);
    --series-1: #8f84e4;
    --series-1-soft: #3a3466;
    --glass: rgba(30, 30, 32, .70);
    --glass-edge: rgba(255, 255, 255, .10);
    --shadow: none;
    --shadow-pop: 0 24px 60px -12px rgba(0, 0, 0, .8), 0 0 0 .5px var(--line);
    --shadow-float: 0 10px 34px -8px rgba(0, 0, 0, .7), 0 0 0 .5px rgba(255, 255, 255, .08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --panel: #1c1c1e; --panel-2: #2c2c2e; --fill: rgba(120,120,128,.24);
  --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.18);
  --hover: rgba(255,255,255,.06); --press: rgba(255,255,255,.12);
  --ink: #ffffff; --ink-2: #d1d1d6; --ink-3: #98989f;
  --accent: #a69df0; --accent-ink: #ffffff; --accent-btn: #6658cc; --accent-wash: rgba(157,147,236,.16);
  --good: #30d158; --warn: #ffb340; --crit: #ff6961; --crit-wash: rgba(255,105,97,.16);
  --series-1: #8f84e4; --series-1-soft: #3a3466;
  --glass: rgba(30,30,32,.70); --glass-edge: rgba(255,255,255,.10);
  --shadow: none;
  --shadow-pop: 0 24px 60px -12px rgba(0,0,0,.8), 0 0 0 .5px var(--line);
  --shadow-float: 0 10px 34px -8px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.08);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "JP Rounded", ui-rounded, "Nunito", "Zen Maru Gothic",
               "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo,
               "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
  font-size: var(--t-md); line-height: 1.5; letter-spacing: normal;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
::selection { background: var(--accent-wash); }
.ic { width: 16px; height: 16px; flex: none; }

/* ---------- 部品の土台 ---------- */
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; white-space: nowrap; text-align: inherit;
}
button:active { opacity: .6; }
.btn {   /* iOS 26 の丸いボタン */
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
  min-height: 36px; padding: 0 var(--s4); border-radius: var(--r-pill);
  background: var(--fill); color: var(--accent); font-size: var(--t-sm); font-weight: 600;
  transition: background var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.btn:hover { background: var(--press); }
.btn:active { transform: scale(.97); opacity: 1; }
button.primary {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 var(--s5); border-radius: var(--r-pill);
  background: var(--accent-btn); color: #fff; font-size: var(--t-md); font-weight: 600;
  transition: opacity var(--fast), transform var(--fast) var(--ease);
}
button.primary:hover { opacity: .88; }
button.primary:active { opacity: .78; transform: scale(.98); }
button.link { color: var(--accent); min-height: 44px; padding: 0 var(--s2); font-size: var(--t-md); font-weight: 500; }
button.danger { color: var(--crit); }
.muted { color: var(--ink-3); font-size: var(--t-sm); }
.row { display: flex; align-items: center; gap: var(--s2); }
.row > label { flex: none; white-space: nowrap; }

/* ---------- ツールバー（狭い画面：中央の小さいタイトル） ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  height: calc(48px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--s2), env(safe-area-inset-right)) 0 max(var(--s2), env(safe-area-inset-left));
  background: transparent; border-bottom: .5px solid transparent;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
body.scrolled .toolbar, body[data-screen="workout"] .toolbar {
  background: var(--glass); border-bottom-color: var(--line);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
}
.toolbar h1 {
  position: absolute; left: 76px; right: 76px; top: env(safe-area-inset-top); height: 48px;
  display: flex; align-items: center; justify-content: center;
  margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transition: opacity var(--fast) var(--ease); pointer-events: none;
}
body.scrolled .toolbar h1, body[data-screen="workout"] .toolbar h1 { opacity: 1; }
.toolbar h1 .count { font-weight: 400; color: var(--ink-3); margin-left: var(--s2); font-variant-numeric: tabular-nums; }
.tb-btn {
  display: inline-flex; align-items: center; gap: var(--s1);
  height: 44px; min-width: 44px; padding: 0 var(--s3); border-radius: var(--r-pill);
  color: var(--accent); font-size: var(--t-md); font-weight: 500;
}
.tb-btn:hover { background: var(--hover); }
.tb-btn .ic { width: 12px; height: 20px; }

main { max-width: 720px; margin: 0 auto; padding: 0 var(--s4) calc(96px + env(safe-area-inset-bottom)); }
body[data-screen="workout"] main { padding-top: var(--s3); padding-bottom: var(--s5); }
.lt { padding: 0 0 var(--s4); }
.lt-title { margin: 0; font-size: var(--t-title); font-weight: 700; letter-spacing: .01em; line-height: 1.15; }
body[data-screen="workout"] .lt { display: none; }

/* ---------- タブバー：狭い画面は浮いたピル型、広い画面は左のサイドバー ---------- */
.tabbar {
  position: fixed; z-index: 30; display: flex; flex-direction: column;
  background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-float), inset 0 0 0 1px var(--glass-edge);
}
.tabbar .sb-title, .tabbar .sb-sub { display: none; }
.tab { display: flex; align-items: center; color: var(--ink-2); font-weight: 500; }
.tab svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 720px) {
  .tabbar {
    left: var(--s4); right: var(--s4);
    /* ホームインジケータ（34px）の分を丸ごと避けると一段浮いて見えるので、バーのすぐ下に収まるまで下げる */
    bottom: max(var(--s5), calc(env(safe-area-inset-bottom) - 8px));
    border-radius: var(--r-pill); padding: var(--s1);
  }
  .tabbar .tabs { display: flex; }
  /* 内容が短いホームだけ、iPhone のホーム画面アプリで固定バーが約59px上に浮く。
     常に1pxだけスクロールできる高さにして、他の画面と同じ挙動にそろえる */
  body { min-height: calc(100vh + 1px); min-height: calc(100dvh + 1px); }
  .tab {
    flex: 1; min-width: 0; flex-direction: column; justify-content: center; gap: 2px;
    padding: 6px 2px 5px; border-radius: var(--r-pill); font-size: 10px;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { background: var(--accent-wash); color: color-mix(in srgb, var(--accent) 80%, var(--ink)); font-weight: 600; }
  body[data-screen="workout"] .tabbar { display: none; }
}
@media (min-width: 721px) {
  body { padding-left: 264px; }
  .tabbar { top: var(--s2); bottom: var(--s2); left: var(--s2); width: 248px; border-radius: var(--r-lg); padding: var(--s5) var(--s3) var(--s3); }
  .tabbar .sb-title { display: block; padding: 0 var(--s2); font-size: var(--t-md); font-weight: 700; }
  .tabbar .sb-sub { display: block; padding: 2px var(--s2) var(--s5); font-size: var(--t-xs); color: var(--ink-3); }
  .tabbar .tabs { display: flex; flex-direction: column; gap: 2px; }
  .tab { padding: 7px var(--s3); gap: var(--s2); border-radius: var(--r-pill); font-size: var(--t-md); color: var(--ink); text-align: left; }
  .tab svg { width: 18px; height: 18px; color: var(--accent); }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--accent-btn); color: #fff; font-weight: 600; }
  .tab.on svg { color: #fff; }
  .toolbar { justify-content: flex-start; height: calc(60px + env(safe-area-inset-top)); padding-left: var(--s6); padding-right: var(--s6); }
  .toolbar h1 { position: static; height: auto; flex: 1; justify-content: flex-start; padding-left: var(--s2); left: auto; right: auto; }
  main { padding: var(--s2) var(--s6) var(--s8); }
  body[data-screen="workout"] main { padding-top: var(--s3); }
  .wo-nav { top: calc(60px + env(safe-area-inset-top)); margin: 0 calc(-1 * var(--s6)) var(--s3); padding: var(--s2) var(--s6); }
}
@media (min-width: 1100px) {
  body[data-screen="home"] main { max-width: 1120px; }
  #homeScreen:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  #resumeCard { grid-column: 1 / -1; }
}

/* ---------- 板（カード）とグループ ---------- */
.card, .group { background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow); margin-bottom: var(--s4); }
.card { padding: var(--s4); }
.group { overflow: hidden; }
.group-title { margin-top: var(--s3); padding: 0 var(--s4) 6px; font-size: var(--t-sm); font-weight: 500; color: var(--ink-3); }
.group-foot { margin: calc(-1 * var(--s2)) 0 var(--s5); padding: 0 var(--s4); font-size: var(--t-sm); color: var(--ink-3); }
.group + .group-foot, .group-foot + .group-foot { margin-top: calc(-1 * var(--s2)); }
.cell { position: relative; display: flex; align-items: center; gap: var(--s3); min-height: 48px; padding: var(--s2) var(--s4); font-size: var(--t-md); }
.cell + .cell { border-top: 1px solid var(--line); }
.cell label { flex: none; white-space: nowrap; }
.cell .detail { margin-left: auto; color: var(--ink-3); text-align: right; }
.cell.actions { gap: var(--s2); flex-wrap: wrap; }

/* ---------- ホーム ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
.tile { background: var(--panel); border-radius: var(--r-md); padding: var(--s4); box-shadow: var(--shadow); }
.tile .label { font-size: var(--t-xs); color: var(--ink-3); font-weight: 500; }
.tile .value { font-size: var(--t-lg); font-weight: 600; margin-top: var(--s1); letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.tile .value small { font-size: var(--t-sm); font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.tile .foot { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; white-space: normal; }

.menu-btn { position: relative; display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 68px; padding: var(--s3) var(--s4); text-align: left; color: var(--ink); }
.menu-btn + .menu-btn { border-top: 1px solid var(--line); }
.menu-btn:active { background: var(--press); opacity: 1; }
.menu-btn .badge {
  width: 36px; height: 36px; flex: none; border-radius: var(--r-md);
  background: var(--accent-wash); color: var(--accent);
  display: grid; place-items: center; font-size: var(--t-md); font-weight: 700;
}
.menu-btn .t { flex: 1; min-width: 0; display: block; }
.menu-btn .line { display: flex; align-items: center; gap: var(--s2); }
.menu-btn .line b { font-size: var(--t-md); font-weight: 600; }
.menu-btn .line .next-tag, .menu-btn .line .last { margin-left: auto; }
.menu-btn .sub { display: block; margin-top: 1px; font-size: var(--t-sm); color: var(--ink-3); white-space: normal; }
.menu-btn .last { flex: none; font-size: var(--t-xs); color: var(--ink-3); }
.menu-btn .chev { width: 8px; height: 14px; flex: none; color: var(--ink-3); }
button.start-btn { display: flex; justify-content: center; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 64px;
  margin-bottom: var(--s4); padding: var(--s3) var(--s5); border-radius: var(--r-lg); text-align: left; }
button.start-btn b { font-size: 17px; font-weight: 700; }
button.start-btn span { font-size: var(--t-sm); opacity: .85; font-weight: 500; }
.week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: var(--s3); }
.week-strip i { display: grid; place-items: center; aspect-ratio: 1; border-radius: 7px; background: var(--fill);
  font-style: normal; font-size: 10px; font-weight: 700; color: var(--accent-ink); }
.week-strip i.on { background: var(--accent-btn); }
.week-strip i.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.next-tag { flex: none; font-size: var(--t-xs); font-weight: 600; color: var(--accent); background: var(--accent-wash); padding: 3px 10px; border-radius: var(--r-pill); }
.group-note { margin: calc(-1 * var(--s2)) 0 var(--s5); padding: 0 var(--s4); font-size: var(--t-sm); color: var(--ink-3); }

/* ---------- 記録画面 ---------- */
.date-row { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 0 var(--s4); margin-bottom: var(--s4); background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.date-row label { flex: none; font-size: var(--t-md); }
.date-row input[type="date"] { width: auto; margin-left: auto; }

#exerciseList .card { padding: 0; overflow: hidden; scroll-margin-top: calc(108px + env(safe-area-inset-top)); }
/* 記録画面：種目の目次（上に貼りつく。タップでその種目へ） */
.wo-nav { position: sticky; top: calc(48px + env(safe-area-inset-top)); z-index: 20;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin: 0 calc(-1 * var(--s4)) var(--s3); padding: var(--s2) var(--s4);
  background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border-bottom: .5px solid var(--line); }
.wo-nav::-webkit-scrollbar { display: none; }
.wo-nav button { flex: none; display: inline-flex; align-items: center; gap: 5px; max-width: 170px; padding: 6px 12px;
  border-radius: var(--r-pill); background: var(--fill); color: var(--ink-2); font-size: var(--t-sm); font-weight: 500; }
.wo-nav button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wo-nav button i { font-style: normal; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.wo-nav button svg { display: none; width: 14px; height: 14px; }
.wo-nav button.done { background: var(--accent-btn); color: #fff; }
.wo-nav button.done i { display: none; }
.wo-nav button.done svg { display: block; }
/* 下へスクロールしている間は目次を引っ込め、上へ戻すと出す */
.wo-nav { transition: transform .25s var(--ease), opacity .25s var(--ease); }
.wo-nav.tuck { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.wo-bar { position: absolute; left: 0; bottom: -.5px; height: 2.5px; background: var(--accent-btn);
  border-radius: 0 2px 2px 0; transition: width .35s var(--ease); }
body:not([data-screen="workout"]) .wo-bar { display: none; }
/* 履歴：週ごとの総挙上量 */
.vol-chart { padding: var(--s4); margin-bottom: var(--s4); }
.vol-chart .head { display: block; }
.vol-chart .head b { display: block; font-size: var(--t-md); font-weight: 600; }
.vol-chart .head > span { display: block; margin-top: 2px; font-size: var(--t-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.vol-chart .head .up { color: var(--good); }
.vol-chart svg { display: block; width: 100%; height: auto; margin-top: var(--s3); }
.vol-chart .bar { fill: var(--series-1-soft); }
.vol-chart .bar.now { fill: var(--series-1); }
.vol-chart .lbl { font-size: 10px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.vol-chart .val { font-size: 10px; fill: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.ex-top { display: flex; gap: var(--s3); padding: var(--s4); }
.ex-info { flex: 1; min-width: 0; }
.illust {
  width: 56px; height: 56px; flex: none; padding: 0; overflow: hidden; cursor: pointer;
  border-radius: var(--r-md); background: var(--fill); display: grid; place-items: center;
}
.illust svg { width: 100%; height: 100%; display: block; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.illust img { width: 100%; height: 100%; object-fit: cover; display: block; }
.illust .s { stroke: var(--ink-3); stroke-width: 3; }
.illust .p { stroke: var(--ink); stroke-width: 3; }
.illust .m { stroke: var(--accent); stroke-width: 4; }

/* 筋肉マップ：効く筋肉を赤、補助を薄い赤で塗る（グラデーションで立体感を出す） */
:root {
  --m1-a: #ff8176; --m1-b: #e8392e; --m1-c: #a81c16;
  --m2-a: #ffd0ca; --m2-b: #f7a198; --m2-c: #e07a6f;
  --m3-a: #ffa69d; --m3-b: #f26a5f; --m3-c: #cc4a40;
  --m0-a: color-mix(in srgb, var(--ink-3) 20%, var(--panel));
  --m0-c: color-mix(in srgb, var(--ink-3) 36%, var(--panel));
  --mb: color-mix(in srgb, var(--ink-3) 22%, var(--panel));
}
:root[data-theme="dark"] {
  --m1-a: #ff7d72; --m1-b: #e5483c; --m1-c: #a8261f;
  --m2-a: #9a5650; --m2-b: #7e403b; --m2-c: #5f2f2b; --m3-a: #d06a61; --m3-b: #b44c43; --m3-c: #86342d;
  --m0-a: #6a6a71; --m0-c: #4c4c52; --mb: #55555b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m1-a: #ff7d72; --m1-b: #e5483c; --m1-c: #a8261f;
    --m2-a: #9a5650; --m2-b: #7e403b; --m2-c: #5f2f2b; --m3-a: #d06a61; --m3-b: #b44c43; --m3-c: #86342d;
    --m0-a: #6a6a71; --m0-c: #4c4c52; --mb: #55555b;
  }
}
.mm path, .mm circle, .mm rect { stroke: var(--panel); stroke-width: .8; stroke-linejoin: round; }
.mm .b  { fill: var(--mb); }
.mm .m0 { fill: url(#mg-0); }
.mm .m1 { fill: url(#mg-1); }
.mm .m2 { fill: url(#mg-2); }
.mm .m3 { fill: url(#mg-3); }
/* ホームの「今週の部位」 */
.week-map { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s2); }
.week-map .views { display: flex; flex: none; }
.week-map .views svg { width: 84px; height: 117px; display: block; }
.week-map .views g[data-k] { cursor: pointer; }
.week-map .views g.sel path { stroke: var(--ink); stroke-width: 1.2; }
.week-map .info { flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--ink-2); line-height: 1.6; }
.week-map .info b { color: var(--ink); font-size: var(--t-md); }
.heat-legend { display: flex; align-items: center; gap: 4px; margin-top: var(--s2); font-size: var(--t-xs); color: var(--ink-3); }
.heat-legend i { width: 14px; height: 8px; border-radius: 3px; }
.goal { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s1); }
.goal svg { width: 48px; height: 48px; flex: none; transform: rotate(-90deg); }
.goal .track { fill: none; stroke: var(--fill); stroke-width: 7; }
.goal .bar { fill: none; stroke: var(--accent-btn); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.goal.done .bar { stroke: var(--good); }
.illust.mmap { background: var(--fill); }
.muscle-box { display: flex; flex-direction: column; align-items: stretch; gap: var(--s3); margin: var(--s2) 0 var(--s4); padding: var(--s3) var(--s4);
  background: var(--fill); border-radius: var(--r-lg); }
.muscle-box .views { display: flex; justify-content: center; gap: var(--s5); flex: none; }
.muscle-box .views svg { width: 78px; height: 108px; display: block; }
.muscle-box .legend { display: grid; gap: 4px; font-size: var(--t-sm); color: var(--ink-2); line-height: 1.5; min-width: 0; }
.muscle-box .legend > div { display: flex; align-items: baseline; gap: var(--s2); }
.muscle-box .legend > div > b { flex: none; min-width: 3.6em; white-space: nowrap; }
.muscle-box .legend b { font-weight: 600; color: var(--ink); }
.muscle-box .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; flex: none; }
.muscle-box .dot.p { background: var(--m1-b); }
.muscle-box .dot.s { background: var(--m2-b); }
.ex-head { display: flex; align-items: baseline; gap: var(--s2); }
.ex-head b { font-size: 17px; font-weight: 600; }
.ex-head .done { color: var(--good); flex: none; display: inline-flex; }
.ex-head .target { margin-left: auto; font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prev { margin-top: 2px; font-size: var(--t-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prev.none { color: var(--ink-3); font-size: var(--t-xs); }

.est { padding: var(--s3) var(--s4); border-top: 1px solid var(--line); font-size: var(--t-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.est b { color: var(--ink); font-size: var(--t-md); font-weight: 600; }
.est .pb { color: var(--good); font-weight: 600; }
.hint { margin: 0 var(--s4) var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--good-wash); color: var(--good); font-size: var(--t-sm); }

/* 入力を終えた種目を1行に畳む */
.ex-chev { display: none; margin-left: auto; align-items: center; color: var(--ink-3); }
.ex-summary { display: none; margin-top: 2px; font-size: var(--t-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.next-row { padding: var(--s1) var(--s4) var(--s4); }
.next-row button {
  width: 100%; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  border-radius: var(--r-pill); background: var(--good-wash); color: var(--good); font-size: var(--t-md); font-weight: 600;
}
.card.collapsed .sets-box, .card.collapsed .est, .card.collapsed .hint,
.card.collapsed .next-row, .card.collapsed .prev, .card.collapsed .ex-head .target { display: none; }
.card.collapsed .illust { width: 44px; height: 44px; }
.card.collapsed .ex-top { align-items: center; }
.card.collapsed .ex-summary { display: block; }
.card.collapsed .ex-chev { display: inline-flex; }
.card.collapsed .ex-info { cursor: pointer; }

/* セット入力 */
.set { display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s4); min-height: 56px; border-top: 1px solid var(--line); }
.set .no { width: 18px; font-size: var(--t-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.set input { width: 100%; min-width: 0; min-height: 40px; padding: 0 var(--s3); text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; }
.set .unit { font-size: var(--t-md); color: var(--ink-3); flex: none; }
/* 回数がまだ空のセットの重量は、前回からの仮の値なので薄く出す */
.set:has(.r input:placeholder-shown) .w input { color: var(--ink-3); }
.set .f { display: flex; align-items: center; gap: var(--s1); min-width: 0; }
.set .w { flex: 1.3; }
.set .r { flex: 1; }
.set .step-btn { flex: none; width: 44px; height: 44px; margin: 0 -4px; color: var(--accent); display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-pill); }
.set .del { flex: none; width: 44px; height: 44px; margin: 0 -10px 0 -4px; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-pill); }
.set-foot { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4); border-top: 1px solid var(--line); }
.set-foot .link { padding: 0; display: inline-flex; align-items: center; gap: 6px; }
.step-pick { margin-left: auto; min-height: 44px; color: var(--ink-3); font-size: var(--t-md); }

/* 入力欄：灰色の地に枠なし。フォーカスで白くなり、アクセントの枠が出る */
select, input[type="text"], input[type="number"], input[type="date"], input[type="search"], textarea {
  font: inherit; font-size: var(--t-md); color: var(--ink); width: 100%;
  min-height: 36px; padding: var(--s2) var(--s3);
  background-color: var(--fill); border: 1px solid transparent; border-radius: var(--r-sm);
  transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease), background-color var(--fast) var(--ease);
}
input:focus, textarea:focus { outline: none; background-color: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
textarea { resize: vertical; min-height: 72px; }
input.bw-input { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.memo-card label { display: block; margin-bottom: var(--s2); font-size: var(--t-sm); color: var(--ink-3); }

/* 保存バー */
.save-bar {
  position: sticky; bottom: 0; z-index: 20; margin: 0 calc(-1 * var(--s4));
  padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background: var(--glass); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
}
.save-bar button.primary { width: 100%; min-height: 50px; }

/* ---------- セグメント（丸型）とスイッチ ---------- */
.seg { display: inline-flex; background: var(--fill); border-radius: var(--r-pill); padding: 2px; }
.seg button { min-height: 30px; padding: 5px var(--s4); border-radius: var(--r-pill); font-size: var(--t-sm); font-weight: 500; color: var(--ink); text-align: center; transition: background var(--fast) var(--ease); }
.seg button.on { background: var(--panel); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 0, 0, .10), 0 0 0 .5px rgba(0, 0, 0, .04); }
:root[data-theme="dark"] .seg button.on { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on { background: #636366; } }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }
.switch { position: relative; flex: none; width: 46px; height: 28px; border-radius: var(--r-pill); background: var(--fill); transition: background 220ms var(--ease); }
.switch::before { content: ""; position: absolute; inset: -8px -4px; }
.switch::after {
  content: ""; position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .16), 0 0 0 .5px rgba(0, 0, 0, .04); transition: transform 260ms var(--spring);
}
.switch[aria-checked="true"] { background: var(--accent-btn); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch:active { opacity: 1; }

/* ---------- 履歴 ---------- */
.hist-filter { margin: 0 0 var(--s3); }
.month-head {
  position: sticky; top: calc(48px + env(safe-area-inset-top)); z-index: 10;
  display: flex; align-items: baseline; gap: var(--s2);
  margin: 0 calc(-1 * var(--s4)); padding: var(--s3) var(--s5) var(--s2);
  background: var(--bg); font-weight: 600; font-size: var(--t-md);
}
.month-head span { margin-left: auto; font-size: var(--t-sm); font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
#logList .card { padding: 0; }
.log-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s4) var(--s3); cursor: pointer; }
.log-head .t { flex: 1; min-width: 0; }
.log-head b { display: block; font-size: 17px; font-weight: 600; }
.log-time { display: block; margin-top: 2px; font-size: var(--t-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.log-head .log-chev { flex: none; display: inline-flex; color: var(--ink-3); transition: transform .25s var(--ease); }
.log-card.open .log-chev { transform: rotate(180deg); }
.log-card:not(.open) .log-body, .log-card:not(.open) .log-memo { display: none; }
.log-body { font-variant-numeric: tabular-nums; }
.log-body > div { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--s3); row-gap: 2px; min-height: 48px; padding: 10px var(--s4); border-top: 1px solid var(--line); font-size: var(--t-md); color: var(--ink-2); }
.log-body .sets { flex: 1 0 auto; max-width: 100%; text-align: right; overflow-wrap: anywhere; }
.log-body button { flex: 0 1 auto; max-width: 100%; text-align: left; white-space: normal; font-size: var(--t-md); font-weight: 500; color: var(--ink); }
.log-body button::after { content: "›"; color: var(--ink-3); margin-left: 6px; font-size: 18px; line-height: 1; }
.log-memo { padding: var(--s3) var(--s4); border-top: 1px solid var(--line); font-size: var(--t-md); color: var(--ink-3); }
.log-del { flex: none; color: var(--ink-3); padding: 14px 10px; margin: -14px -4px -14px -6px; display: inline-flex; align-items: center; border-radius: var(--r-pill); }
.empty { text-align: center; padding: var(--s7) var(--s4); color: var(--ink-3); font-size: var(--t-md); }

/* ---------- 推定1RMの推移グラフ ---------- */
.trend { margin: var(--s2) 0 var(--s3); }
.trend-sum { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; font-size: var(--t-sm); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.trend-sum b { font-size: var(--t-md); color: var(--ink); font-weight: 600; }
.trend-sum .up { color: var(--good); font-weight: 600; margin-left: auto; }
.trend svg { display: block; width: 100%; height: auto; overflow: visible; margin-top: var(--s1); }
.t-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.t-base { stroke: var(--line-strong); stroke-width: 1; }
.t-area { fill: var(--series-1-soft); opacity: .7; stroke: none; }
.t-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.t-dot { fill: var(--panel); stroke: var(--series-1); stroke-width: 1.5; }
.t-dot.last { fill: var(--series-1); }
.t-tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.t-val { fill: var(--ink-2); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.t-val.last { fill: var(--ink); font-weight: 700; }
.t-val.best { fill: var(--good); font-weight: 700; }

/* ---------- シート（狭い画面は下から浮いて出る。広い画面は中央のダイアログ） ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0 var(--s2) var(--s2); background: rgba(0, 0, 0, .28); }
.modal-card {
  position: relative; width: 100%; max-width: 560px; overflow-y: auto; overscroll-behavior: contain;
  max-height: calc(100dvh - var(--s7) - env(safe-area-inset-top));
  background: var(--panel); border-radius: var(--r-sheet); box-shadow: var(--shadow-pop);
  padding: 0 var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
}
.sheet-grab { position: sticky; top: 0; z-index: 2; height: 28px; margin: 0 calc(-1 * var(--s5)); display: flex; justify-content: center; align-items: center; touch-action: none; background: var(--panel); }
.sheet-grab::before { content: ""; width: 36px; height: 5px; border-radius: var(--r-pill); background: var(--line-strong); }
.modal-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); }
.modal-head b { flex: 1; font-size: 17px; font-weight: 700; }
.modal-head .link { min-height: 36px; padding: 0; }
.modal-top { display: flex; gap: var(--s3); align-items: flex-start; }
.modal-top .muted { margin: 0; flex: 1; font-size: var(--t-md); }
.illust.big { width: 96px; height: 96px; margin: 0; border-radius: var(--r-lg); }
.illust.big.zoom { width: 100%; height: auto; aspect-ratio: 1 / 1; }
.hist { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--line); }
.hist h4 { margin: 0 0 var(--s1); font-size: var(--t-sm); font-weight: 500; color: var(--ink-3); }
.hist-row { display: flex; gap: var(--s2); align-items: baseline; padding: var(--s2) 0; border-bottom: 1px solid var(--line); font-size: var(--t-md); font-variant-numeric: tabular-nums; }
.hist-row:last-of-type { border-bottom: 0; }
.hist-row .d { flex: none; width: 78px; color: var(--ink-3); font-size: var(--t-sm); }
.hist-row .v { flex: 1; min-width: 0; }
.hist-row .e { flex: none; color: var(--ink-3); font-size: var(--t-sm); }
.hist-row.best .e { color: var(--good); font-weight: 600; }
.filebtn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); cursor: pointer; min-height: 36px; padding: 0 var(--s4); border-radius: var(--r-pill); background: var(--fill); color: var(--accent); font-size: var(--t-sm); font-weight: 600; }
@media (min-width: 721px) {
  .modal { align-items: center; padding: var(--s5); }
  .modal-card { max-width: 560px; max-height: calc(100vh - var(--s6)); padding-top: var(--s5); }
  .sheet-grab { display: none; }
}

/* ---------- 通知 ---------- */
.toast {
  position: fixed; z-index: 60; left: var(--s4); right: var(--s4); margin: 0 auto; max-width: 400px;
  bottom: calc(88px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4);
  background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); font-size: var(--t-sm);
}
.toast .ic { color: var(--good); width: 20px; height: 20px; }
.toast .msg { flex: 1; min-width: 0; font-weight: 600; font-size: var(--t-md); }
.toast .sub { display: block; margin-top: 1px; color: var(--ink-3); font-size: var(--t-sm); font-weight: 400; }
.toast .sub .pb { color: var(--good); font-weight: 600; }
@media (min-width: 721px) { .toast { left: 264px; bottom: var(--s5); } }

/* ---------- 動き ---------- */
@keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheet-out { from { transform: translateY(var(--drag, 0px)); } to { transform: translateY(100%); } }
@keyframes pop-in  { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes veil-in  { from { opacity: 0; } to { opacity: 1; } }
@keyframes veil-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes toast-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(8px); } }
.view-in { animation: view-in var(--anim) var(--ease); }
.modal { animation: veil-in 200ms ease; }
.modal .modal-card { animation: sheet-up 420ms var(--spring); }
.modal.closing { animation: veil-out 260ms ease forwards; }
.modal.closing .modal-card { animation: sheet-out 260ms var(--spring) forwards; }
@media (min-width: 721px) { .modal .modal-card { animation: pop-in 200ms var(--ease); } }

    <linearGradient id="mg-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--m2-a)"/><stop offset=".55" style="stop-color:var(--m2-b)"/><stop offset="1" style="stop-color:var(--m2-c)"/></linearGradient>

<header class="toolbar">

  <h1 id="title">LIFT LOG</h1>
  <div class="wo-bar" id="woBar" style="width:0"></div>
</header>

<main>
  <div class="lt"><h2 class="lt-title" id="largeTitle">LIFT LOG</h2></div>

  <!-- ホーム画面 -->

      <div class="row">

        <button class="link" id="resumeDiscard">破棄</button>

    </div>
    <div class="home-main">

      <div class="tiles" id="summaryTiles"></div>

    <div class="home-side">
      <div class="group" id="menuList"></div>
      <p class="group-note">PUSH → PULL → LEG の順に、行く日に次のメニューを実施します。</p>

  <!-- 記録画面 -->
  <section id="workoutScreen" hidden>

  <!-- 設定画面 -->
  <section id="settingsScreen" hidden>
    <div id="cloudCard" hidden>
      <div class="group-title">クラウド同期</div>

        <div class="cell"><span>アカウント</span><span class="detail" id="cloudStatus"></span></div>
        <div class="cell actions">
          <button class="btn" id="cloudSignIn">Googleでログイン</button>
          <button class="btn" id="cloudSyncNow" hidden>今すぐ同期</button>
          <button class="link" id="cloudSignOut" hidden>ログアウト</button>
        </div>
      </div>
      <p class="group-foot" id="cloudNote"></p>
    </div>

    <div class="group-title">外観</div>
    <div class="group">
      <div class="cell">
        <span>表示テーマ</span>
        <span class="seg" id="themeSeg" style="margin-left:auto">

    </div>

    <div class="group-title">プロフィール</div>

      <div class="cell">

    <div class="group-title">通知</div>

      </div>
    </div>
    <p class="group-foot" id="reminderNote"></p>

    <div class="group-title">データ</div>

      <div class="cell"><span>使用中の容量</span><span class="detail" id="storageInfo"></span></div>

</main>

<nav class="tabbar" id="tabbar" aria-label="メインメニュー">
  <div class="sb-title">LIFT LOG</div>
  <div class="sb-sub">PUSH・PULL・LEG の3分割</div>

  const v = localStorage.getItem(LANG_KEY);

  if (setting !== "auto") return setting;
  return /^ja\b/i.test(navigator.language || "") ? "ja" : "en";

// 画面に最初から書いてある文言（HTML）を訳す。元の日本語は覚えておき、日本語に戻すときに使う
function translateStatic() {
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (n.parentElement && n.parentElement.closest("script, style")) continue;
    if (n.__ja === undefined) {
      const key = n.nodeValue.trim();
      if (!key || EN[key] === undefined) continue;
      n.__ja = n.nodeValue;
    }
    const key = n.__ja.trim();
    n.nodeValue = n.__ja.replace(key, t(key));
  }
  for (const el of document.querySelectorAll("[aria-label], [placeholder], [title]")) {
    for (const attr of ["aria-label", "placeholder", "title"]) {
      if (!el.hasAttribute(attr)) continue;
      const store = "__ja_" + attr;
      if (el[store] === undefined) {
        const v = el.getAttribute(attr);
        if (EN[v] === undefined) continue;
        el[store] = v;
      }
      el.setAttribute(attr, t(el[store]));
    }
  }
  document.documentElement.lang = LANG;
}

function loadLogs() {

}

const DELETED_KEY = "workout-deleted-v1";
function loadDeleted() {
  try { return JSON.parse(localStorage.getItem(DELETED_KEY)) || []; }
  catch (e) { return []; }
}
function markDeleted(id) {
  const list = loadDeleted();
  if (!list.includes(String(id))) list.push(String(id));
  localStorage.setItem(DELETED_KEY, JSON.stringify(list));
}

const STEP_CHOICES = [1, 2.5, 5, 10, 20];
function loadSteps() {
  try { return JSON.parse(localStorage.getItem(STEP_KEY)) || {}; }
  catch (e) { return {}; }
}
function stepFor(name) {
  const v = loadSteps()[name];
  return STEP_CHOICES.includes(v) ? v : 2.5;
}
function cycleStep(name) {
  const steps = loadSteps();
  const i = STEP_CHOICES.indexOf(stepFor(name));
  steps[name] = STEP_CHOICES[(i + 1) % STEP_CHOICES.length];
  localStorage.setItem(STEP_KEY, JSON.stringify(steps));
  return steps[name];
}

const DELETED_PHOTO_KEY = "workout-deleted-photos-v1";
function loadDeletedPhotos() {
  try { return JSON.parse(localStorage.getItem(DELETED_PHOTO_KEY)) || []; }
  catch (e) { return []; }
}
function markPhotoDeleted(name) {
  const list = loadDeletedPhotos();
  if (!list.includes(name)) list.push(name);
  localStorage.setItem(DELETED_PHOTO_KEY, JSON.stringify(list));
}

function loadPhotos() {
  try { return JSON.parse(localStorage.getItem(PHOTO_KEY)) || {}; }
  catch (e) { return {}; }
}
function savePhotos(photos) {
  try {
    localStorage.setItem(PHOTO_KEY, JSON.stringify(photos));
    if (window.cloudSync) window.cloudSync();
    return true;
  } catch (e) {
    alert(t("保存容量がいっぱいです。使っていない種目の写真を削除してください。"));
    return false;
  }
}
// 編集中に「前回」「自己ベスト」がその記録自身を指してしまわないよう、
// 対象のidを一時的に除外できるようにしておく（編集画面を離れたら必ずnullに戻す）
let excludeLogId = null;

// 日付の新しい順に並べた配列を返す。同じ日付の中では、実際に保存した時刻が新しい方を上にする
// （date は編集で書き換えられるので主キーのまま。savedAt が無い古い記録は id（作成時刻）で代用する）
function sortedLogs() {
  return loadLogs()
    .filter(l => l.id !== excludeLogId)
    .sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      const at = new Date(a.savedAt || a.id).getTime();
      const bt = new Date(b.savedAt || b.id).getTime();
      return bt - at;
    });
}
function findLogById(id) {
  return loadLogs().find(l => l.id === id) || null;
}
// 種目名から、直近の記録（セット配列）を探す
function findLastRecord(exerciseName) {
  for (const log of sortedLogs()) {
    const found = (log.exercises || []).find(ex => ex.name === exerciseName);
    if (found && found.sets.length > 0) return { date: log.date, sets: found.sets };
  }
  return null;
}

function mirrorPath(d) {
  let i = 0;
  return d.replace(/-?\d+(?:\.\d+)?/g, n => (i++ % 2 === 0 ? String(+(100 - n).toFixed(1)) : n));
}
// info は {p, s}（種目の主・補助）か、筋肉名 → クラス名を返す関数（ホームの今週の部位）
function muscleSVG(view, info, box) {
  const both = d => '<path d="' + d + '"/><path d="' + mirrorPath(d) + '"/>';
  const wrap = (cls, d, key) => '<g class="' + cls + '" data-k="' + key + '">' + both(d) + '</g>';
  let out = '<svg class="mm" viewBox="' + (box || "14 0 72 100") + '" aria-hidden="true">';
  out += '<g class="b"><circle cx="50" cy="9" r="6.2"/><rect x="46" y="13" width="8" height="7" rx="2"/>' +
         BODY_BASE.map(both).join("") + '</g>';
  const paths = MUSCLE_PATHS[view];
  for (const key in paths) {
    const state = typeof info === "function" ? info(key)
      : info.p.includes(key) ? "m1" : info.s.includes(key) ? "m2" : "m0";
    out += wrap(state, paths[key], key);
  }
  return out + '</svg>';
}

function exerciseHistory(name) {
  const rows = [];
  for (const log of sortedLogs()) {
    for (const ex of log.exercises) {
      if (ex.name !== name) continue;
      const best = bestOfSets(ex.sets);
      rows.push({ date: log.date, sets: ex.sets, est: best ? best.value : null });
    }
  }
  return rows;
}

// ===== 1RM推定 ========================================================
// Epley式: 1RM = 重量 × (1 + レップ数 / 30)
// 12回を超えると誤差が大きくなるので、そのときは参考値として扱う
const BODYWEIGHT_KEY = "workout-bodyweight-v1";
function loadBodyweight() {
  const v = Number(localStorage.getItem(BODYWEIGHT_KEY));
  return v > 0 ? v : 58;
}
function saveBodyweight(kg) {
  localStorage.setItem(BODYWEIGHT_KEY, String(kg));
}

function estimate1RM(weight, reps) {
  const w = Number(weight), r = Number(reps);
  if (!(w > 0) || !(r > 0)) return null;
  if (r === 1) return w;
  return Math.round(w * (1 + r / 30) * 10) / 10;
}
// セット配列の中で最も高い推定1RMを返す
function bestOfSets(sets) {
  let best = null;
  for (const set of sets) {
    const e = estimate1RM(set.weight, set.reps);
    if (e !== null && (best === null || e > best.value)) {
      best = { value: e, weight: Number(set.weight), reps: Number(set.reps) };
    }
  }
  return best;
}
// 過去の全記録から、その種目の自己ベスト（推定1RM）を探す
function personalBest(exerciseName) {
  let best = null;
  for (const log of loadLogs()) {
    for (const ex of log.exercises) {
      if (ex.name !== exerciseName) continue;
      const b = bestOfSets(ex.sets);
      if (b && (best === null || b.value > best.value)) best = { ...b, date: log.date };
    }
  }
  return best;
}

// ===== 小さなユーティリティ ===========================================
// "3×8〜10" → { sets: 3, repMax: 10 }
function parseTarget(target) {
  const [setPart, repPart] = target.split("×");
  const reps = repPart.split("〜").map(Number);
  return { sets: Number(setPart), repMax: Math.max(...reps) };
}
function todayString() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  const day = new Date(iso + "T00:00:00").getDay();
  if (LANG === "en") return "SunMonTueWedThuFriSat".substr(day * 3, 3) + " " + Number(m) + "/" + Number(d);
  return Number(m) + "/" + Number(d) + "（" + "日月火水木金土"[day] + "）";
}
// 保存した時刻（savedAt の ISO文字列）を "19:32" の形にする。
// 古い記録には savedAt が無いので、その場合は空文字を返す
function formatTime(savedAt) {
  if (!savedAt) return "";
  const d = new Date(savedAt);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes());
}
// セット配列 → "30kg × 10,10,8"（重量が混在する場合は "30kg×10, 32.5kg×8"）
function formatSets(sets) {
  const weights = [...new Set(sets.map(s => s.weight))];
  if (weights.length === 1) {
    const w = weights[0] === null ? t("自重") : weights[0] + "kg";
    return w + " × " + sets.map(s => s.reps).join(",");
  }
  return sets.map(s => (s.weight === null ? t("自重") : s.weight + "kg") + "×" + s.reps).join(", ");
}
function totalVolume(exercises) {
  let v = 0;
  for (const ex of exercises) for (const s of ex.sets) v += (s.weight || 0) * s.reps;
  return v;
}

let currentScreen = "home";

function showScreen(name, title) {
  const same = (name === currentScreen);

  for (const key in screens) screens[key].hidden = (key !== name);
  document.body.dataset.screen = name;
  titleEl.textContent = title;          // ナビゲーションバーの小さいタイトル（記録画面ではこれだけ）
  largeTitleEl.textContent = title;     // タブ画面の大きいタイトル
  backBtn.hidden = (name !== "workout");
  for (const t of tabButtons) t.classList.toggle("on", t.dataset.tab === name);
  window.scrollTo(0, 0);
  document.body.classList.remove("scrolled");

  if (!same) replay(screens[name], "view-in");
  currentScreen = name;
}

// 大きいタイトルが画面の外に出たら、ナビゲーションバーを材質つきにして小さいタイトルを出す
let lastScrollY = 0;
addEventListener("scroll", () => {
  document.body.classList.toggle("scrolled", scrollY > 40);
  // 記録画面では、下へスクロール中は種目の目次を隠して入力欄を広く使う
  const dy = scrollY - lastScrollY;
  if (Math.abs(dy) > 6) {
    document.getElementById("woNav").classList.toggle("tuck", dy > 0 && scrollY > 160);
    lastScrollY = scrollY;
  }
}, { passive: true });

// 同じアニメーションを繰り返し再生するには、一度外して再描画を挟む必要がある
function replay(el, className) {
  el.classList.remove(className);
  void el.offsetWidth;
  el.classList.add(className);
}
// ===== ブラウザの履歴と連動 ==========================================
// マウスのサイドボタン、ブラウザの戻る/進む、Macのスワイプはすべて履歴操作なので、
// 画面の切り替えを history に積んでおかないとアプリごと離脱してしまう。
let currentState = { s: "home" };
let handlingPop = false;   // popstate 経由の描画では履歴を積み直さない

let replaceNext = false;   // 保存後のように、前の画面に戻したくないとき

function goTo(state) {
  if (!handlingPop) {
    if (replaceNext) history.replaceState(state, "");
    else history.pushState(state, "");
  }
  replaceNext = false;
  currentState = state;
}

function renderState(state) {
  const s = (state && state.s) || "home";
  if (s === "workout" && MENUS[state.menu]) {
    renderWorkout(state.menu, state.editId ? findLogById(state.editId) : null);
  }
  else if (s === "history") renderHistory();
  else if (s === "settings") renderSettings();
  else renderHome();
}

window.addEventListener("popstate", event => {
  handlingPop = true;
  const next = event.state || { s: "home" };

  // ポップアップを開いた状態で戻ったときは、閉じるだけにする（下の画面は作り直さない）
  if (currentState.s === "modal" && next.s === currentState.under) {
    closeModal();
    currentState = next;
  } else {
    if (!modal.hidden) closeModal();
    renderState(next);
    currentState = next;
  }
  handlingPop = false;
});

// いま開いているタブをもう一度押したら、一番上までスクロールする（iOSと同じ）
const toTop = () => scrollTo({ top: 0, behavior: "smooth" });
backBtn.onclick = () => history.back();
homeTab.onclick = () => currentScreen === "home" ? toTop() : renderHome();
historyBtn.onclick = () => currentScreen === "history" ? toTop() : renderHistory();
settingsBtn.onclick = () => currentScreen === "settings" ? toTop() : renderSettings();

  excludeLogId = null;

}

  const logs = sortedLogs();
  if (logs.length === 0) return "A";
  const i = MENU_ORDER.indexOf(logs[0].menu);
  return MENU_ORDER[(i + 1) % MENU_ORDER.length];
}

  const found = sortedLogs().find(l => l.menu === menuId);
  return found ? found.date : null;
}

    btn.innerHTML =
      '<span class="badge">' + menuMark(id) + '</span>' +
      '<span class="t"><span class="line"><b>' + menuName(id) + '</b>' + right + '</span>' +
      '<span class="sub">' + menuTitle(id) + '</span></span>' + CHEVRON;
    btn.onclick = () => renderWorkout(id);

  drawSummaryTiles(logs);

  // 次にやるメニューを、いちばん押しやすい大きなボタンで出す（続きの入力があるときはそちらを優先）
  const start = document.getElementById("startNext");
  start.hidden = draftHasInput(draft);
  start.innerHTML = '<b>' + t("{m} を始める", { m: menuName(next) }) + '</b>' +
    '<span>' + menuTitle(next) + ' · ' + t("{n}種目", { n: MENUS[next].exercises.length }) + '</span>';
  start.onclick = () => renderWorkout(next);

  goTo({ s: "home" });
  showScreen("home", "LIFT LOG");
}

function drawSummaryTiles(logs) {
  const box = document.getElementById("summaryTiles");

  // 今週（月曜はじまり）の回数と、前回の内容。記録が0件でも同じ形で見せて、何が分かる画面かを伝える
  const weekStart = startOfWeek();
  const thisWeek = logs.filter(l => l.date >= weekStart);
  const done = thisWeek.length;
  const last = logs[0];
  const daysAgo = last ? Math.round(
    (new Date(todayString() + "T00:00:00") - new Date(last.date + "T00:00:00")) / 86400000
  ) : null;
  const C = 2 * Math.PI * 20;
  const ratio = Math.min(1, done / WEEKLY_GOAL);

  box.innerHTML =
    '<div class="tile">' +
      '<div class="label">' + t("今週の目標") + '</div>' +
      '<div class="goal' + (done >= WEEKLY_GOAL ? " done" : "") + '">' +
        '<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="track" cx="24" cy="24" r="20"/>' +
        '<circle class="bar" cx="24" cy="24" r="20" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' +
          (C * (1 - ratio)).toFixed(1) + '"' + (done ? "" : ' style="opacity:0"') + '/></svg>' +
        '<div><div class="value" style="margin:0">' + done + '<small>' + t("/ {n}回", { n: WEEKLY_GOAL }) + '</small></div>' +
        '<div class="foot">' + (done >= WEEKLY_GOAL ? t("達成！") : t("あと{n}回", { n: WEEKLY_GOAL - done })) + '</div></div>' +
      '</div>' +
      '<div class="week-strip">' + weekDaysHTML(logs, weekStart) + '</div>' +
    '</div>' +
    '<div class="tile">' +
      '<div class="label">' + t("前回") + '</div>' +
      (last
        ? '<div class="value">' + (daysAgo === 0 ? t("今日") : daysAgo + '<small>' + t("日前", { n: daysAgo }) + '</small>') + '</div>' +
          '<div class="foot">' + formatDate(last.date) + ' ' + menuName(last.menu) + '</div>'
        : '<div class="value">—</div>' +
          '<div class="foot">' + t("記録をつけると、前回の重量が自動で入ります") + '</div>') +
    '</div>' +
    '<div class="tile" style="grid-column:1/-1">' +
      '<div class="label">' + t("今週の部位（セット数）") + '</div>' +
      weekMapHTML(thisWeek) +
    '</div>';
  bindWeekMap(box, thisWeek);
}

// 今週の月〜日を1マスずつ並べ、行った日はメニューの印（P/L/G）で埋める
function weekDaysHTML(logs, weekStart) {
  const byDate = {};
  for (const l of logs) if (!byDate[l.date]) byDate[l.date] = l.menu;
  const today = todayString();
  const start = new Date(weekStart + "T00:00:00");
  const p = n => String(n).padStart(2, "0");
  let out = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const key = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    const menu = byDate[key];
    out += '<i class="' + (menu ? "on" : "") + (key === today ? " today" : "") + '" title="' + formatDate(key) + '">' +
           (menu ? menuMark(menu) : "") + '</i>';
  }
  return out;
}

const WEEKLY_GOAL = 3;            // 週の目標回数
const SET_TARGET = [10, 20];      // 1部位あたりの週の目安セット数

function startOfWeek() {
  const d = new Date(todayString() + "T00:00:00");
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);   // 月曜まで戻す
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

// 筋肉ごとの今週のセット数。主に効く種目は1セット、補助は0.5セットとして数える（Fitbod と同じ数え方）
function weeklyMuscleSets(logs) {
  const sets = {};
  for (const l of logs) {
    for (const ex of l.exercises) {
      const info = MUSCLES[ex.name];
      if (!info) continue;
      const n = ex.sets.filter(st => Number(st.reps) > 0).length;
      for (const k of info.p) sets[k] = (sets[k] || 0) + n;
      for (const k of info.s) sets[k] = (sets[k] || 0) + n * 0.5;
    }
  }
  return sets;
}
function heatClass(n) {
  if (!n) return "m0";
  if (n < SET_TARGET[0] / 2) return "m2";
  if (n < SET_TARGET[0]) return "m3";
  return "m1";
}
function weekMapHTML(weekLogs) {
  const sets = weeklyMuscleSets(weekLogs);
  const cls = k => heatClass(sets[k]);
  return '<div class="week-map">' +
      '<div class="views">' + muscleSVG("front", cls) + muscleSVG("back", cls) + '</div>' +
      '<div class="info" id="weekMapInfo">' + weekMapSummary(sets) + '</div>' +
    '</div>' +
    '<div class="heat-legend">0' +
      '<i style="background:var(--m0-a)"></i><i style="background:var(--m2-b)"></i>' +
      '<i style="background:var(--m3-b)"></i><i style="background:var(--m1-b)"></i>' +
      t("{n}セット以上", { n: SET_TARGET[0] }) + '</div>';
}
function weekMapSummary(sets) {
  const keys = Object.keys(sets);
  if (keys.length === 0) return t("記録すると、今週鍛えた筋肉が赤くなります。筋肉をタップするとセット数が出ます。");
  const reached = keys.filter(k => sets[k] >= SET_TARGET[0]).length;
  return t("<b>{n}部位</b>が目安の{t}セットに到達。<br>筋肉をタップするとセット数が出ます。", { n: reached, t: SET_TARGET[0] });
}
function bindWeekMap(box, weekLogs) {
  const info = box.querySelector("#weekMapInfo");
  if (!info) return;
  const sets = weeklyMuscleSets(weekLogs);
  box.querySelectorAll(".week-map g[data-k]").forEach(g => {
    g.onclick = () => {
      const k = g.dataset.k;
      box.querySelectorAll(".week-map g.sel").forEach(x => x.classList.remove("sel"));
      box.querySelectorAll('.week-map g[data-k="' + k + '"]').forEach(x => x.classList.add("sel"));
      const n = sets[k] || 0;
      info.innerHTML = '<b>' + t(MUSCLE_NAMES[k]) + '</b><br>' +
        t("{n}セット（目安 {a}〜{b}）", { n: Math.round(n * 10) / 10, a: SET_TARGET[0], b: SET_TARGET[1] }) +
        (n >= SET_TARGET[1] ? '<br>' + t("多め") : n >= SET_TARGET[0] ? '<br>' + t("十分") : '');
    };
  });
}

const dataSummary = document.getElementById("dataSummary");

// ===== 表示テーマ =====================================================
// "auto"（OSに従う）/ "light" / "dark" の3つ。
const THEME_KEY = "workout-theme-v1";
const THEME_COLORS = { light: "#f2f2f7", dark: "#000000" };

function loadTheme() {
  const v = localStorage.getItem(THEME_KEY);
  return (v === "light" || v === "dark") ? v : "auto";
}

function applyTheme(theme) {
  if (theme === "auto") {
    delete document.documentElement.dataset.theme;
    localStorage.removeItem(THEME_KEY);
  } else {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
  }

  // ブラウザのアドレスバーやステータスバーの色も合わせる
  const effective = theme !== "auto" ? theme
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[effective];

  for (const btn of themeSeg.children) {
    btn.classList.toggle("on", btn.dataset.themeValue === theme);
  }
}

const themeSeg = document.getElementById("themeSeg");
for (const btn of themeSeg.children) {
  btn.onclick = () => applyTheme(btn.dataset.themeValue);
}
// OSの設定が変わったとき、「自動」なら追従させる
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (loadTheme() === "auto") applyTheme("auto");
});

// ブラウザに「容量が足りなくなってもこのデータは消さないで」と申請する
async function requestPersistentStorage() {
  if (!(navigator.storage && navigator.storage.persist)) {
    persistNote.textContent = t("定期的に書き出してバックアップを取ってください。");
    return;
  }
  const granted = await navigator.storage.persisted() || await navigator.storage.persist();
  persistNote.textContent = t(granted
    ? "✓ このブラウザがデータを保持する設定になっています。"
    : "※ 容量不足時にブラウザがデータを消す可能性があります。定期的に書き出してください。");
}

document.getElementById("importInput").onchange = event => {
  const file = event.target.files[0];
  event.target.value = "";   // 同じファイルを選び直せるようにする
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      alert(t("読み込めませんでした。書き出したJSONファイルを選んでください。"));
      return;
    }
    if (!data || !Array.isArray(data.logs)) {
      alert(t("このアプリのバックアップファイルではないようです。"));
      return;
    }

    // 既にある記録はそのまま。同じidが無いものだけを足す（マージ）
    const current = loadLogs();
    const known = new Set(current.map(l => l.id));
    const newLogs = data.logs.filter(l => l && !known.has(l.id));

    const photos = loadPhotos();
    let newPhotos = 0;
    for (const name in (data.photos || {})) {
      if (!photos[name]) { photos[name] = data.photos[name]; newPhotos++; }
    }

    if (newLogs.length === 0 && newPhotos === 0) {
      alert(t("追加できる新しいデータはありませんでした。"));
      return;
    }
    if (!confirm(t("記録 {n}件、写真 {p}枚を追加します。\n今ある記録は消えません。よろしいですか？",
                   { n: newLogs.length, p: newPhotos }))) return;

    saveLogs(current.concat(newLogs));
    savePhotos(photos);
    renderHome();
    updateDataCard();
    showToast(t("読み込みました"), t("記録 {n}件 / 写真 {p}枚を追加", { n: newLogs.length, p: newPhotos }));
  };
  reader.readAsText(file);
};

// ===== 記録画面 =======================================================
let draft = null;      // 入力中のワークアウト
let currentMenu = null;
const collapsedNames = new Set();   // 入力を終えて1行に畳んだ種目

// 入力中の内容をブラウザに保存しておく。アプリを閉じてしまっても消えないようにするため
// （保存ボタンを押し忘れたまま完全終了すると、それまでの入力が消えていた問題への対応）
const DRAFT_KEY = "workout-draft-wip-v1";
const REMINDER_NOTIFIED_KEY = "workout-reminder-notified-v1";   // どの更新時刻について通知済みか

function draftHasInput(d) {
  return !!d && d.exercises.some(ex => ex.sets.some(s => s.reps !== "" && Number(s.reps) > 0));
}
function persistDraft() {
  if (!draftHasInput(draft)) { clearPersistedDraft(); return; }
  localStorage.setItem(DRAFT_KEY, JSON.stringify({ draft, updatedAt: new Date().toISOString() }));
}
function loadPersistedDraft() {
  try {
    const wip = JSON.parse(localStorage.getItem(DRAFT_KEY));
    return (wip && wip.draft && MENUS[wip.draft.menu]) ? wip : null;
  } catch (e) { return null; }
}
function clearPersistedDraft() {
  localStorage.removeItem(DRAFT_KEY);
  localStorage.removeItem(REMINDER_NOTIFIED_KEY);
}
// 経過時間を「12分前」のような日本語にする
function formatElapsed(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return t("たった今");
  if (min < 60) return t("{n}分前", { n: min });
  const h = Math.floor(min / 60);
  return min % 60 ? t("{h}時間{m}分前", { h, m: min % 60 }) : t("{h}時間前", { h });
}

// メニューを変更したあとでも、過去の記録を編集して保存したときに種目が消えないようにする。
// 記録にあって今のメニューに無い種目は、末尾に足した版のメニューを返す
function menuWithExtras(menu, log) {
  if (!log) return menu;
  const extras = log.exercises
    .filter(ex => !menu.exercises.some(d => d.name === ex.name))
    .map(ex => ({
      name: ex.name,
      target: ex.sets.length + "×" + Math.max(...ex.sets.map(x => x.reps)),
      note: "今のメニューにない種目（過去の記録）"
    }));
  return extras.length ? { ...menu, exercises: menu.exercises.concat(extras) } : menu;
}

// 前回と同じ重量を初期値に入れた、まだ回数が空の種目（毎回打ち直さなくて済む）
function newExercise(def) {
  const last = findLastRecord(def.name);
  const prefill = last ? last.sets[0].weight : "";
  return {
    name: def.name,
    sets: Array.from({ length: parseTarget(def.target).sets }, () => ({ weight: prefill, reps: "" }))
  };
}

// 保存前の下書きが、メニュー変更前の種目構成のままになっていたら、今のメニューに合わせて並べ直す
function reconcileDraft(d) {
  const menu = menuWithExtras(MENUS[d.menu], d.editingId ? findLogById(d.editingId) : null);
  const aligned = d.exercises.length === menu.exercises.length &&
                  d.exercises.every((e, i) => e.name === menu.exercises[i].name);
  if (!aligned) {
    d.exercises = menu.exercises.map(def => d.exercises.find(e => e.name === def.name) || newExercise(def));
  }
  return d;
}

function renderWorkout(menuId, editLog) {
  const menu = MENUS[menuId];
  currentMenu = menuWithExtras(menu, editLog);

  // 入力途中で画面を離れても消えないよう、同じ編集対象なら下書きを引き継ぐ
  const hasInput = draftHasInput(draft);
  const sameTarget = draft && draft.menu === menuId &&
    (draft.editingId || null) === (editLog ? editLog.id : null);

  if (hasInput && sameTarget) {
    document.getElementById("dateInput").value = draft.date;
    document.getElementById("dateInput").onchange = e => { draft.date = e.target.value; persistDraft(); };
    const memo = document.getElementById("memoInput");
    memo.value = draft.memo;
    memo.oninput = e => { draft.memo = e.target.value; persistDraft(); };
    document.getElementById("saveBtn").textContent = t(draft.editingId ? "この内容で更新" : "この内容で保存");
    excludeLogId = editLog ? editLog.id : null;
    drawExercises();
    goTo({ s: "workout", menu: menuId, editId: editLog ? editLog.id : undefined });
    showScreen("workout", menuName(menuId));
    updateProgress();
    return;
  }
  if (hasInput && !confirm(
    t(editLog ? "入力中の内容が保存されていません。破棄してこの記録を編集しますか？"
              : "入力中の内容が保存されていません。破棄して別のメニューを開きますか？")
  )) {
    return;
  }
  if (hasInput) clearPersistedDraft();   // 破棄が確定したので、保存忘れの通知対象からも外す

  // 除外は findLastRecord など各所から参照されるので、draft を組み立てる前に切り替える
  excludeLogId = editLog ? editLog.id : null;
  collapsedNames.clear();

  draft = {
    date: editLog ? editLog.date : todayString(),
    menu: menuId,
    memo: editLog ? (editLog.memo || "") : "",
    editingId: editLog ? editLog.id : null,
    exercises: currentMenu.exercises.map(def => {
      // 編集中の記録にその種目があれば、実際の値をそのまま使う
      const fromLog = editLog && editLog.exercises.find(ex => ex.name === def.name);
      if (fromLog) {
        return {
          name: def.name,
          sets: fromLog.sets.map(s => ({
            weight: s.weight === null ? "" : String(s.weight),
            reps: String(s.reps)
          }))
        };
      }
      return newExercise(def);
    })
  };

  const dateInput = document.getElementById("dateInput");
  dateInput.value = draft.date;
  dateInput.onchange = e => { draft.date = e.target.value; persistDraft(); };
  const memoInput = document.getElementById("memoInput");
  memoInput.value = draft.memo;
  memoInput.oninput = e => { draft.memo = e.target.value; persistDraft(); };
  document.getElementById("saveBtn").textContent = t(editLog ? "この内容で更新" : "この内容で保存");

  drawExercises();
  goTo({ s: "workout", menu: menuId, editId: editLog ? editLog.id : undefined });
  showScreen("workout", menuName(menuId));
  updateProgress();
}

// ヘッダーのタイトルに進捗を出す（メニューC 3/7 のように。編集中は先頭に明記する）
function updateProgress() {
  if (!draft) return;
  const done = draft.exercises.filter(
    ex => ex.sets.some(s => s.reps !== "" && Number(s.reps) > 0)
  ).length;
  const prefix = draft.editingId ? t("編集：") : "";
  titleEl.innerHTML = prefix + menuName(draft.menu) +
    '<span class="count">' + done + " / " + draft.exercises.length + "</span>";
  document.getElementById("woBar").style.width = (done / draft.exercises.length * 100) + "%";
  const chips = document.getElementById("woNav").children;
  draft.exercises.forEach((ex, i) => {
    if (chips[i]) chips[i].classList.toggle("done", ex.sets.some(s => s.reps !== "" && Number(s.reps) > 0));
  });
  persistDraft();
}

function drawExercises() {
  const container = document.getElementById("exerciseList");
  const photos = loadPhotos();
  container.innerHTML = "";

  // 上に貼りつく種目の目次。入力済みの種目は色が変わる
  const nav = document.getElementById("woNav");
  nav.innerHTML = "";
  nav.classList.remove("tuck");
  currentMenu.exercises.forEach((def, i) => {
    const chip = document.createElement("button");
    chip.innerHTML = '<i>' + (i + 1) + '</i>' + icon("check") + '<span>' + shortName(def.name) + '</span>';
    chip.title = exName(def.name);
    chip.onclick = () => {
      const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      document.getElementById("exerciseList").children[i].scrollIntoView({ behavior, block: "start" });
      setTimeout(() => { lastScrollY = scrollY; nav.classList.remove("tuck"); }, 600);
    };
    nav.appendChild(chip);
  });

  currentMenu.exercises.forEach((def, exIndex) => {
    const card = document.createElement("div");
    card.className = "card";

    // --- 図解 + 種目名 ---
    const top = document.createElement("div");
    top.className = "ex-top";

    const art = document.createElement("button");
    art.className = "illust";
    art.title = t("タップで拡大 / 写真を登録");
    art.innerHTML = thumbHTML(def.name, photos);
    art.onclick = () => openArtModal(def);
    top.appendChild(art);

    const info = document.createElement("div");
    info.className = "ex-info";
    const last = findLastRecord(def.name);
    info.innerHTML =
      '<div class="ex-head"><b>' + exName(def.name) + '</b>' +
      '<span class="done" hidden>' + icon("check") + '</span>' +
      '<span class="target">' + (LANG === "en" ? def.target.replace("〜", "–") : def.target) + '</span>' +
      '<span class="ex-chev">' + icon("chev") + '</span></div>' +
      '<div class="prev' + (last ? '' : ' none') + '">' +
      (last ? t("前回") + " " + formatDate(last.date) + "　" + formatSets(last.sets)
            : t(def.note || "初回：軽めの重量で軌道を確認")) +
      '</div>' +
      '<div class="ex-summary"></div>';
    top.appendChild(info);
    card.appendChild(top);

    const setsBox = document.createElement("div");
    setsBox.className = "sets-box";
    card.appendChild(setsBox);

    const est = document.createElement("div");
    est.className = "est";
    est.hidden = true;
    card.appendChild(est);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.hidden = true;
    card.appendChild(hint);

    // 全セット入力できたら出す。押すとこの種目を1行に畳んで、次の種目へスクロールする
    const isLast = exIndex === currentMenu.exercises.length - 1;
    const nextRow = document.createElement("div");
    nextRow.className = "next-row";
    nextRow.hidden = true;
    const nextBtn = document.createElement("button");
    nextBtn.innerHTML = icon("check") + "<span>" + t(isLast ? "完了" : "完了して次の種目へ") + "</span>";
    nextRow.appendChild(nextBtn);
    card.appendChild(nextRow);

    const summary = info.querySelector(".ex-summary");
    function summaryText() {
      const filled = draft.exercises[exIndex].sets
        .filter(s => s.reps !== "" && Number(s.reps) > 0)
        .map(s => ({ weight: s.weight === "" ? null : Number(s.weight), reps: Number(s.reps) }));
      return filled.length ? formatSets(filled) : "";
    }
    function setCollapsed(on) {
      card.classList.toggle("collapsed", on);
      if (on) { collapsedNames.add(def.name); summary.textContent = summaryText(); }
      else collapsedNames.delete(def.name);
      info.setAttribute("aria-expanded", String(!on));
    }
    info.onclick = () => { if (card.classList.contains("collapsed")) setCollapsed(false); };
    nextBtn.onclick = () => {
      setCollapsed(true);
      // 畳んで高さが変わったあとの位置へスクロールさせる
      requestAnimationFrame(() => {
        const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
        const cards = [...container.children];
        const next = cards.slice(exIndex + 1).find(c => !c.classList.contains("collapsed"));
        if (next) next.scrollIntoView({ behavior, block: "start" });
        else window.scrollTo({ top: document.documentElement.scrollHeight, behavior });
      });
    };

    // この種目に1セットでも入力があれば「済」にする
    function updateDone() {
      const sets = draft.exercises[exIndex].sets;
      const done = sets.some(s => s.reps !== "" && Number(s.reps) > 0);
      const all = sets.length > 0 && sets.every(s => s.reps !== "" && Number(s.reps) > 0);
      card.classList.toggle("finished", done);
      card.querySelector(".done").hidden = !done;
      nextRow.hidden = !all;
    }

    // 入力中の内容から推定1RMを出し、自己ベストと比べる
    function updateEstimate() {
      const best = bestOfSets(draft.exercises[exIndex].sets);
      const pb = personalBest(def.name);

      if (!best) {
        // まだ入力が無いときは、自己ベストだけ出しておく
        if (pb) {
          est.hidden = false;
          est.innerHTML = t("自己ベスト（推定1RM）") + " <b>" + pb.value + "kg</b>" +
            t("（{d} {w}kg×{r}）", { d: formatDate(pb.date), w: pb.weight, r: pb.reps });
        } else {
          est.hidden = true;
        }
        return;
      }

      est.hidden = false;
      let html = t("推定1RM") + " <b>" + best.value + "kg</b>";
      if (def.ratio) {
        html += t("（体重比 {r}倍）", { r: (best.value / loadBodyweight()).toFixed(2) });
      }
      if (pb) {
        html += best.value > pb.value
          ? ' <span class="pb">' + t("自己ベスト更新（前 {v}kg）", { v: pb.value }) + '</span>'
          : "　" + t("自己ベスト") + " " + pb.value + "kg";
      }
      if (best.reps > 12) html += "<br>" + t("※13回以上からの推定は誤差が大きめです");
      est.innerHTML = html;
    }

    // 目標レップを全セット達成できたら増量をすすめる
    function updateHint() {
      const { sets: targetSets, repMax } = parseTarget(def.target);
      const done = draft.exercises[exIndex].sets.filter(s => s.reps !== "" && Number(s.reps) > 0);
      const cleared = done.length >= targetSets && done.every(s => Number(s.reps) >= repMax);
      hint.hidden = !cleared;
      if (cleared) hint.textContent = t("全セット完遂 ✓ 次回は 2.5〜5kg 上げてOK");
    }

    // − / ＋ を押したときの重量の増減
    function adjustWeight(setIndex, direction) {
      const sets = draft.exercises[exIndex].sets;
      const before = Number(sets[setIndex].weight || 0);
      const step = stepFor(def.name);
      const after = Math.max(0, Math.round((before + direction * step) * 100) / 100);

      // まだ回数を入れていない後続セットが同じ重量なら、まとめて合わせる
      for (let j = setIndex + 1; j < sets.length; j++) {
        if (sets[j].reps === "" && Number(sets[j].weight || 0) === before) {
          sets[j].weight = String(after);
        }
      }
      sets[setIndex].weight = String(after);
      drawSets();
      updateHint();
      updateEstimate();
      updateProgress();
    }

    function drawSets() {
      setsBox.innerHTML = "";
      draft.exercises[exIndex].sets.forEach((set, setIndex) => {
        const row = document.createElement("div");
        row.className = "set";

        const no = document.createElement("span");
        no.className = "no";
        no.textContent = (setIndex + 1) + ".";
        row.appendChild(no);

        const minus = document.createElement("button");
        minus.className = "step-btn"; minus.innerHTML = icon("minus");
        minus.setAttribute("aria-label", t("重量を下げる"));
        minus.onclick = () => adjustWeight(setIndex, -1);
        row.appendChild(minus);

        const wField = document.createElement("span");
        wField.className = "f w";
        const w = document.createElement("input");
        w.type = "number"; w.inputMode = "decimal"; w.step = "0.5"; w.min = "0";
        w.placeholder = t(def.bw ? "自重" : "重量"); w.value = set.weight;
        w.oninput = () => { set.weight = w.value; updateEstimate(); updateProgress(); };
        wField.appendChild(w);
        const wUnit = document.createElement("span");
        wUnit.className = "unit"; wUnit.textContent = "kg";
        wField.appendChild(wUnit);
        row.appendChild(wField);

        const plus = document.createElement("button");
        plus.className = "step-btn"; plus.innerHTML = icon("plus");
        plus.setAttribute("aria-label", t("重量を上げる"));
        plus.onclick = () => adjustWeight(setIndex, 1);
        row.appendChild(plus);

        const rField = document.createElement("span");
        rField.className = "f r";
        const r = document.createElement("input");
        r.type = "number"; r.inputMode = "numeric"; r.min = "0";
        // 前回の同じセットの回数を薄く出して、今日の目標にしてもらう
        const prevSet = last && last.sets[setIndex];
        r.placeholder = prevSet ? String(prevSet.reps) : "–"; r.value = set.reps;
        r.oninput = () => {
          set.reps = r.value;
          updateHint(); updateEstimate(); updateDone(); updateProgress();
        };
        rField.appendChild(r);
        const rUnit = document.createElement("span");
        rUnit.className = "unit"; rUnit.textContent = "rep";
        rField.appendChild(rUnit);
        row.appendChild(rField);

        const del = document.createElement("button");
        del.className = "del"; del.innerHTML = icon("close");
        del.title = t("このセットを削除"); del.setAttribute("aria-label", t("このセットを削除"));
        del.onclick = () => {
          // 入力済みのセットは打ち直しになるので、消す前に確認する
          if (set.reps !== "" &&
              !confirm(t("{i}セット目（{w}kg × {r}回）を削除しますか？",
                         { i: setIndex + 1, w: set.weight || 0, r: set.reps }))) return;
          draft.exercises[exIndex].sets.splice(setIndex, 1);
          drawSets(); updateHint(); updateEstimate(); updateDone(); updateProgress();
        };
        row.appendChild(del);

        setsBox.appendChild(row);
      });

      const footer = document.createElement("div");
      footer.className = "set-foot";

      const add = document.createElement("button");
      add.className = "link";
      add.innerHTML = icon("plus") + '<span style="margin-left:4px">' + t("セットを追加") + '</span>';
      add.style.display = "inline-flex";
      add.style.alignItems = "center";
      add.onclick = () => {
        const sets = draft.exercises[exIndex].sets;
        const lastSet = sets[sets.length - 1];
        sets.push({ weight: lastSet ? lastSet.weight : "", reps: "" });
        drawSets(); updateHint(); updateDone(); updateProgress();
      };
      footer.appendChild(add);

      const pick = document.createElement("button");
      pick.className = "step-pick";
      pick.textContent = t("刻み {s}kg", { s: stepFor(def.name) });
      pick.title = t("タップで切り替え");
      pick.onclick = () => { cycleStep(def.name); drawSets(); };
      footer.appendChild(pick);

      setsBox.appendChild(footer);
    }

    drawSets();
    updateEstimate();
    updateDone();
    if (collapsedNames.has(def.name) && !nextRow.hidden) setCollapsed(true);
    else info.setAttribute("aria-expanded", "true");
    container.appendChild(card);
  });
}

document.getElementById("saveBtn").onclick = () => {
  // 回数が入っているセットだけを残す
  const exercises = draft.exercises
    .map(ex => ({
      name: ex.name,
      sets: ex.sets
        .filter(s => s.reps !== "" && Number(s.reps) > 0)
        .map(s => ({
          weight: s.weight === "" ? null : Number(s.weight),
          reps: Number(s.reps)
        }))
    }))
    .filter(ex => ex.sets.length > 0);

  if (exercises.length === 0) {
    alert(t("記録するセットがありません。回数を入力してください。"));
    return;
  }

  const logs = loadLogs();
  const isEdit = !!draft.editingId;
  const savedMenu = draft.menu;
  // 保存する前に、自己ベスト（推定1RM）を更新した種目を拾っておく（初めての種目は数えない）
  const newBests = exercises.filter(ex => {
    const before = personalBest(ex.name);
    const now = bestOfSets(ex.sets);
    return before && now && now.value > before.value;
  }).map(ex => exName(ex.name));

  if (isEdit) {
    const idx = logs.findIndex(l => l.id === draft.editingId);
    if (idx === -1) {
      // 編集中に別の場所（他端末の同期など）で削除された場合
      alert(t("この記録は既に削除されているため、更新できませんでした。"));
      return;
    }
    logs[idx] = {
      ...logs[idx],
      date: draft.date,
      memo: draft.memo,
      exercises: exercises,
      editedAt: new Date().toISOString()   // 元の savedAt は保ち、編集した事実だけ加える
    };
  } else {
    logs.push({
      id: Date.now(),
      date: draft.date,
      savedAt: new Date().toISOString(),   // 保存した時刻（実施日とは別。実施日は編集できるため）
      menu: draft.menu,
      memo: draft.memo,
      exercises: exercises
    });
  }
  saveLogs(logs);

  const setCount = exercises.reduce((n, ex) => n + ex.sets.length, 0);
  draft = null;             // 保存済みなので下書きは破棄する
  excludeLogId = null;
  clearPersistedDraft();    // 保存できたので「保存忘れ」の対象からも外す
  replaceNext = true;       // 保存した記録画面へは戻さない
  renderHome();
  showToast(
    t(isEdit ? "{m} を更新しました" : "{m} を記録しました", { m: menuName(savedMenu) }),
    t("{n}種目 / {s}セット / 総挙上量 {v}kg",
      { n: exercises.length, s: setCount, v: totalVolume(exercises).toLocaleString() }) +
      (newBests.length ? '<br><b class="pb">' + t("自己ベスト更新：{x}", { x: newBests.join(LANG === "en" ? ", " : "・") }) + '</b>' : '')
  );
};
