<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="description" content="A/B/C 3分割メニューのトレーニング記録アプリ">
<!-- ホーム画面に追加したときの挙動（iOS / Android / デスクトップ） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<!-- iOS はホーム画面のアイコンを強くキャッシュするので、差し替えるときは
     ファイル名ごと変える（-v2）。サイズ指定つきも併記して確実に拾わせる -->
<link rel="apple-touch-icon" href="icons/icon-180-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180-v2.png">
<link rel="icon" href="icons/icon-192-v2.png" sizes="192x192" type="image/png">
<title>筋トレ記録</title>
<script>
  // 表示テーマは描画前に当てる。あとから当てると一瞬ちらつくため。
  try {
    var saved = localStorage.getItem("workout-theme-v1");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<style>
/* ==========================================================================
   設計の約束（サブスク・固定費マネージャーと共通）
   - 余白は 4 の倍数のみ（--s1..--s8）。中間値を作らない
   - 文字は 6 段階のみ（--t-xs..--t-2xl）。1px 刻みは使わない
   - 角丸は 3 種類（--r-sm / --r-md / --r-lg）
   - 面は「地」と「板」の2枚だけ。影に頼らず 1px の境界で分ける
   - アイコンは 16px の線画（stroke-width 1.3）。絵文字は使わない
   ========================================================================== */
:root {
  color-scheme: light;

  /* 面と線 */
  --bg: #fbfbfc;
  --panel: #ffffff;
  --panel-2: #f6f6f8;
  --line: rgba(16, 17, 26, .08);
  --line-strong: rgba(16, 17, 26, .14);
  --hover: rgba(16, 17, 26, .04);
  --press: rgba(16, 17, 26, .07);

  /* 文字 */
  --ink: #101119;
  --ink-2: #55566b;
  --ink-3: #8b8c9e;

  /* 意味の色 */
  --accent: #5B5BD6;
  --accent-ink: #ffffff;
  --accent-wash: rgba(91, 91, 214, .10);
  --good: #16794a;
  --good-wash: rgba(22, 121, 74, .09);
  --crit: #c0304a;
  --crit-wash: rgba(192, 48, 74, .09);

  /* 寸法 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --t-xs: 11px; --t-sm: 13px; --t-md: 15px; --t-lg: 20px; --t-xl: 32px; --t-2xl: 48px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;

  --shadow: 0 1px 2px rgba(16,17,26,.04);
  --shadow-pop: 0 12px 32px -8px rgba(16,17,26,.16), 0 0 0 1px var(--line);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --fast: 140ms;
  --anim: 220ms;   /* 画面の切り替え。ここだけ変えれば全体の速さが変わる */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #09090b;
    --panel: #131316;
    --panel-2: #1b1b20;
    --line: rgba(255, 255, 255, .09);
    --line-strong: rgba(255, 255, 255, .16);
    --hover: rgba(255, 255, 255, .05);
    --press: rgba(255, 255, 255, .09);
    --ink: #f7f7f8;
    --ink-2: #b4b5c2;
    --ink-3: #7e7f90;
    --accent: #7C7CEE;
    --accent-ink: #0d0d12;
    --accent-wash: rgba(124, 124, 238, .16);
    --good: #4ade80;
    --good-wash: rgba(74, 222, 128, .14);
    --crit: #f87089;
    --crit-wash: rgba(248, 112, 137, .14);
    --shadow: none;
    --shadow-pop: 0 16px 40px -8px rgba(0,0,0,.7), 0 0 0 1px var(--line);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #09090b; --panel: #131316; --panel-2: #1b1b20;
  --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.05); --press: rgba(255,255,255,.09);
  --ink: #f7f7f8; --ink-2: #b4b5c2; --ink-3: #7e7f90;
  --accent: #7C7CEE; --accent-ink: #0d0d12; --accent-wash: rgba(124,124,238,.16);
  --good: #4ade80; --good-wash: rgba(74,222,128,.14);
  --crit: #f87089; --crit-wash: rgba(248,112,137,.14);
  --shadow: none; --shadow-pop: 0 16px 40px -8px rgba(0,0,0,.7), 0 0 0 1px var(--line);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 0 0 var(--s8);
  background: var(--bg);
  color: var(--ink);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter",
               "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  font-size: var(--t-sm); line-height: 1.5; letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
::selection { background: var(--accent-wash); }

.ic { width: 16px; height: 16px; flex: none; }

/* ---------- ツールバー ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: var(--s2);
  height: 52px; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 0 max(var(--s4), env(safe-area-inset-left));
  padding-top: env(safe-area-inset-top);
  box-sizing: content-box;
}
.toolbar h1 {
  font-size: var(--t-md); font-weight: 600; margin: 0;
  letter-spacing: -0.015em; flex: 1; min-width: 0;
}
.toolbar h1 .count {
  font-size: var(--t-xs); color: var(--ink-3); font-weight: 500;
  margin-left: var(--s2); font-variant-numeric: tabular-nums;
}
.tb-btn {
  display: inline-flex; align-items: center; gap: var(--s1);
  border: 0; background: none; box-shadow: none; color: var(--ink-2);
  padding: var(--s2); border-radius: var(--r-sm);
  cursor: pointer; font: inherit; font-size: var(--t-sm);
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.tb-btn:hover { background: var(--hover); color: var(--ink); }
.tb-btn:active { background: var(--press); }

main { padding: var(--s4); padding-bottom: var(--s8); max-width: 720px; margin: 0 auto; }

/* ---------- ボタン ---------- */
button {
  appearance: none; font: inherit; font-size: var(--t-sm); font-weight: 500;
  cursor: pointer; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  padding: 7px var(--s3); box-shadow: var(--shadow); white-space: nowrap;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
button:hover { background: var(--hover); }
button:active { background: var(--press); }
button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
button.primary:hover { background: var(--accent); opacity: .88; }
button.link {
  border: 0; background: none; box-shadow: none;
  color: var(--accent); padding: var(--s1) var(--s2);
}
button.link:hover { background: var(--accent-wash); }
button.danger { color: var(--crit); border: 0; background: none; box-shadow: none; }
button.danger:hover { background: var(--crit-wash); }

/* ---------- 板 ---------- */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: var(--s4); margin-bottom: var(--s3);
}
.card > h2 { font-size: var(--t-md); font-weight: 600; margin: 0; letter-spacing: -0.015em; }
.muted { color: var(--ink-3); font-size: var(--t-xs); }
.row { display: flex; align-items: center; gap: var(--s2); }
.row > label { flex: none; white-space: nowrap; }
.lead { color: var(--ink-2); font-size: var(--t-sm); margin: 0 0 var(--s3); }

/* ---------- 概要タイル ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: var(--s3); box-shadow: var(--shadow);
}
.tile .label { font-size: var(--t-xs); color: var(--ink-3); font-weight: 500; }
.tile .value {
  font-size: var(--t-lg); font-weight: 600; margin-top: 2px;
  letter-spacing: -0.025em; font-variant-numeric: tabular-nums;
}
.tile .value small { font-size: var(--t-sm); font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.tile .foot {
  font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---------- メニュー選択 ---------- */
.menu-btn {
  width: 100%; text-align: left; display: flex; align-items: center;
  gap: var(--s3); padding: var(--s4); margin-bottom: var(--s2);
  transition: border-color var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.menu-btn:active { transform: scale(.994); }
.menu-btn .badge {
  width: 36px; height: 36px; flex: none; border-radius: var(--r-md);
  background: var(--accent-wash); color: var(--accent);
  display: grid; place-items: center; font-weight: 600; font-size: var(--t-md);
}
.menu-btn .t { flex: 1; min-width: 0; }
.menu-btn .t b { display: block; font-size: var(--t-md); font-weight: 600; letter-spacing: -0.015em; }
.menu-btn .t span { font-size: var(--t-xs); color: var(--ink-3); }
.next-tag {
  font-size: var(--t-xs); font-weight: 600; color: var(--accent);
  background: var(--accent-wash); padding: 3px var(--s2); border-radius: 999px;
  flex: none;
}
.menu-btn .last { font-size: var(--t-xs); color: var(--ink-3); flex: none; }

.date-row {
  display: flex; align-items: center; gap: var(--s2);
  padding: 0 var(--s1) var(--s3);
}
.date-row label { flex: none; white-space: nowrap; }
.date-row input[type="date"] {
  width: auto; padding: 5px var(--s2); font-size: var(--t-sm);
}

/* ---------- 種目カード ---------- */
.ex-top { display: flex; gap: var(--s3); margin-bottom: var(--s3); }
.ex-info { flex: 1; min-width: 0; }
.illust {
  width: 64px; height: 64px; flex: none; padding: 0;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--panel-2); box-shadow: none;
  overflow: hidden; display: grid; place-items: center; cursor: pointer;
}
.illust:hover { border-color: var(--line-strong); background: var(--panel-2); }
.illust svg { width: 100%; height: 100%; display: block; fill: none;
              stroke-linecap: round; stroke-linejoin: round; }
.illust img { width: 100%; height: 100%; object-fit: cover; display: block; }
.illust .s { stroke: var(--ink-3); stroke-width: 3; }
.illust .p { stroke: var(--ink); stroke-width: 3; }
.illust .m { stroke: var(--accent); stroke-width: 4; }

.ex-head { display: flex; align-items: baseline; gap: var(--s2); }
.ex-head b { font-size: var(--t-md); font-weight: 600; letter-spacing: -0.015em; }
.ex-head .done { color: var(--good); flex: none; display: inline-flex; }
.ex-head .target {
  font-size: var(--t-xs); color: var(--ink-3); margin-left: auto;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.prev { font-size: var(--t-xs); color: var(--ink-3); margin-top: var(--s1);
        font-variant-numeric: tabular-nums; }
.prev.none { color: var(--ink-3); }
.card.finished { border-color: color-mix(in srgb, var(--good) 34%, transparent); }

.est {
  font-size: var(--t-xs); color: var(--ink-3);
  margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.est b { color: var(--ink); font-size: var(--t-sm); font-weight: 600; }
.est .pb { color: var(--good); font-weight: 600; }
.hint {
  font-size: var(--t-xs); color: var(--good); background: var(--good-wash);
  border-radius: var(--r-sm); padding: var(--s2); margin-top: var(--s2);
}

/* ---------- セット入力 ---------- */
.set { display: flex; align-items: center; gap: var(--s1); margin-bottom: var(--s2); }
.set .no {
  width: 18px; font-size: var(--t-xs); color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.set input {
  font: inherit; font-size: var(--t-md); width: 100%; min-width: 0;
  padding: 8px var(--s2); text-align: right;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--panel); color: var(--ink);
  font-variant-numeric: tabular-nums;
  transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
.set input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash);
}
.set .unit { font-size: var(--t-sm); color: var(--ink-3); flex: none; }
.set .f { display: flex; align-items: center; gap: var(--s1); min-width: 0; }
.set .w { flex: 1.3; }
.set .r { flex: 1; }
.set .step-btn {
  flex: none; width: 40px; padding: 10px 0; color: var(--ink-3);
  border: 0; background: none; box-shadow: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.set .step-btn:hover { background: var(--hover); color: var(--ink); }
.set .del {
  flex: none; padding: var(--s2) 6px; color: var(--ink-3);
  border: 0; background: none; box-shadow: none;
}
.set .del:hover { color: var(--crit); background: var(--crit-wash); }
.set-foot { display: flex; align-items: center; gap: var(--s2); }
.step-pick {
  font-size: var(--t-xs); color: var(--ink-3); margin-left: auto;
  border: 0; background: none; box-shadow: none; padding: var(--s1) var(--s2);
}
.step-pick:hover { color: var(--ink); background: var(--hover); }

/* ---------- 設定 ---------- */
.seg { display: inline-flex; background: var(--panel-2); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: none; box-shadow: none; color: var(--ink-3);
  font-size: var(--t-xs); font-weight: 500; padding: 4px var(--s3); border-radius: 6px;
}
.seg button:hover { color: var(--ink); background: none; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

input[type="date"], input[type="number"], textarea {
  font: inherit; font-size: var(--t-md); width: 100%;
  padding: 7px var(--s3); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--panel);
  transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
input:focus, textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash);
}
textarea { resize: vertical; min-height: 64px; }
.bw-input { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.filebtn {
  display: inline-flex; align-items: center; gap: var(--s1); cursor: pointer;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--panel); box-shadow: var(--shadow);
  padding: 7px var(--s3); font-size: var(--t-sm); font-weight: 500;
}
.filebtn:hover { background: var(--hover); }

/* ---------- 保存バー ---------- */
.save-bar {
  position: sticky; bottom: 0;
  padding: var(--s3) 0 max(env(safe-area-inset-bottom), var(--s3));
  background: linear-gradient(to bottom, transparent, var(--bg) 40%);
}
.save-bar button { width: 100%; padding: var(--s3); font-size: var(--t-md); font-weight: 600; }

/* ---------- 履歴 ---------- */
.log-head { display: flex; align-items: baseline; gap: var(--s2); }
.log-head b { font-size: var(--t-md); font-weight: 600; letter-spacing: -0.015em; }
.log-time { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.log-head .vol { font-size: var(--t-xs); color: var(--ink-3); margin-left: auto;
                 font-variant-numeric: tabular-nums; }
.log-body { font-size: var(--t-sm); margin-top: var(--s2); line-height: 1.7;
            font-variant-numeric: tabular-nums; }
.log-body button {
  font-size: var(--t-sm); font-weight: 500; color: var(--ink-2);
  border: 0; background: none; box-shadow: none; padding: 0;
}
.log-body button:hover { color: var(--accent); background: none; }
.log-del {
  flex: none; border: 0; background: none; box-shadow: none;
  color: var(--ink-3); padding: var(--s1); margin-left: var(--s2);
}
.log-del:hover { color: var(--ink); background: var(--hover); }
.log-del.log-trash:hover { color: var(--crit); background: var(--crit-wash); }
.empty { text-align: center; color: var(--ink-3); padding: var(--s7) 0; font-size: var(--t-sm); }

.hist { margin-top: var(--s4); border-top: 1px solid var(--line); padding-top: var(--s3); }
.hist h4 { font-size: var(--t-xs); margin: 0 0 var(--s1); color: var(--ink-3);
           font-weight: 500; letter-spacing: .04em; }
.hist-row {
  display: flex; gap: var(--s2); align-items: baseline;
  font-size: var(--t-sm); padding: var(--s2) 0; border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.hist-row:last-of-type { border-bottom: 0; }
.hist-row .d { color: var(--ink-3); flex: none; width: 72px; font-size: var(--t-xs); }
.hist-row .v { flex: 1; min-width: 0; }
.hist-row .e { flex: none; color: var(--ink-3); font-size: var(--t-xs); }
.hist-row.best .e { color: var(--good); font-weight: 600; }

/* ---------- ポップアップ ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(16, 17, 26, .4);
  display: grid; place-items: center; padding: var(--s4);
}
:root[data-theme="dark"] .modal, :root:not([data-theme="light"]) .modal { background: rgba(0, 0, 0, .55); }
.modal-card {
  background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
  padding: var(--s4); width: 100%; max-width: 380px;
  max-height: 85vh; overflow-y: auto;
}
.modal-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); }
.modal-head b { font-size: var(--t-md); font-weight: 600; flex: 1; letter-spacing: -0.015em; }
.modal-top { display: flex; gap: var(--s3); align-items: flex-start; }
.modal-top .muted { margin: 0; flex: 1; }
.illust.big { width: 96px; height: 96px; flex: none; margin: 0; }
.illust.big.zoom { width: 100%; height: auto; aspect-ratio: 1 / 1; }

/* ---------- 通知 ---------- */
.toast {
  position: fixed; z-index: 60;
  left: var(--s4); right: var(--s4);
  bottom: calc(env(safe-area-inset-bottom) + var(--s5));
  margin: 0 auto; max-width: 360px;
  display: flex; align-items: center; gap: var(--s2);
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-pop);
  padding: var(--s3); font-size: var(--t-sm);
}
.toast .ic { color: var(--good); }
.toast .msg { flex: 1; min-width: 0; }
.toast .sub { display: block; color: var(--ink-3); font-size: var(--t-xs); margin-top: 1px; }

/* ---------- 動き ---------- */
@keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pop-view-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes sheet-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-6px) scale(.985); } }
@keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
@keyframes toast-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(8px); } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

.push-in { animation: view-in var(--anim) var(--ease); }
.pop-in  { animation: pop-view-in var(--anim) var(--ease); }
#title.changed { animation: fade-in var(--anim) var(--ease); }
.toast { animation: toast-in var(--anim) var(--ease); }
.toast.closing { animation: toast-out var(--fast) var(--ease) forwards; }
.modal { animation: fade-in var(--fast) var(--ease); }
.modal .modal-card { animation: sheet-in var(--anim) var(--ease); }
.modal.closing { animation: fade-out var(--fast) var(--ease) forwards; }
.modal.closing .modal-card { animation: sheet-out var(--fast) var(--ease) forwards; }

@media (prefers-reduced-motion: reduce) {
  .push-in, .pop-in, #title.changed,
  .modal, .modal .modal-card,
  .modal.closing, .modal.closing .modal-card,
  .toast, .toast.closing { animation: none; }
}

/* iOSで入力時に画面が拡大しないよう、実寸16px以上を確保する */
@media (max-width: 720px) {
  .set input, input[type="date"], input[type="number"], textarea { font-size: 16px; }
}

</head>
<body>

<header class="toolbar">
  <button id="backBtn" class="tb-btn" hidden>
    <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg>戻る
  </button>
  <h1 id="title">筋トレ記録</h1>
  <button id="historyBtn" class="tb-btn">
    <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.4V8l2.4 1.4"/></svg>履歴
  </button>
  <button id="settingsBtn" class="tb-btn" title="設定" aria-label="設定">
    <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 4.8h5.4M11.6 4.8h2M2.4 11.2h2.2M8.4 11.2h5.2"/><circle cx="9.7" cy="4.8" r="1.7"/><circle cx="6.4" cy="11.2" r="1.7"/></svg>
  </button>
</header>

<main>
  <!-- ホーム画面 -->
  <section id="homeScreen">
    <div class="tiles" id="summaryTiles"></div>
    <div id="menuList"></div>
    <p class="muted" style="margin:var(--s3) var(--s1) 0">
      A → B → C の順に、行く日に次のメニューを実施します。
    </p>

  </section>

  <!-- 記録画面 -->
  <section id="workoutScreen" hidden>
    <div class="date-row">
      <label class="muted" for="dateInput">実施日</label>
      <input type="date" id="dateInput">
    </div>
    <div id="exerciseList"></div>
    <div class="card">
      <label class="muted" for="memoInput">メモ（体調・筋肉痛・気づいたことなど）</label>
      <textarea id="memoInput" placeholder="例）脚に筋肉痛が残っていたので軽め" style="margin-top:6px"></textarea>
    </div>
    <div class="save-bar">
      <button class="primary" id="saveBtn">この内容で保存</button>
    </div>
  </section>

  <!-- 設定画面 -->
  <section id="settingsScreen" hidden>
    <div class="card" id="cloudCard" hidden>
      <div class="row" style="margin-bottom:6px">
        <b style="font-size:15px">クラウド同期</b>
        <span class="muted" id="cloudStatus" style="margin-left:auto"></span>
      </div>
      <p class="muted" id="cloudNote" style="margin:0 0 10px"></p>
      <div class="row">
        <button id="cloudSignIn">Googleでログイン</button>
        <button id="cloudSyncNow" hidden>今すぐ同期</button>
        <button class="link" id="cloudSignOut" hidden>ログアウト</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <b style="font-size:15px">設定とデータ</b>
        <span class="muted" id="storageInfo" style="margin-left:auto"></span>
      </div>
      <div class="row" style="margin-bottom:10px">
        <label class="muted">表示テーマ</label>
        <span class="seg" id="themeSeg" style="margin-left:auto">
          <button data-theme-value="auto">自動</button>
          <button data-theme-value="light">ライト</button>
          <button data-theme-value="dark">ダーク</button>
        </span>
      </div>
      <div class="row" style="margin-bottom:10px">
        <label class="muted" for="bodyweightInput">体重</label>
        <input type="number" inputmode="decimal" step="0.1" min="1"
               id="bodyweightInput" class="bw-input">
        <span class="muted">kg</span>
        <span class="muted" style="margin-left:auto">推定1RMの体重比に使います</span>
      </div>
      <p class="muted" id="dataSummary" style="margin:0 0 10px"></p>
      <div class="row">
        <button id="exportBtn">
          <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><path d="M8 2v8M4.8 7.2 8 10.4l3.2-3.2M2.6 13h10.8"/></svg>書き出し
        </button>
        <label class="filebtn">
          <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.4V2.4M4.8 5.6 8 2.4l3.2 3.2M2.6 13h10.8"/></svg>読み込み
          <input type="file" accept="application/json,.json" id="importInput" hidden>
        </label>
      </div>
      <p class="muted" id="persistNote" style="margin:10px 0 0"></p>
      <p class="muted" style="margin:6px 0 0;font-size:11px">
        アプリの版 <span id="appVersion"></span>
      </p>
    </div>
  </section>

  <!-- 履歴画面 -->
  <section id="historyScreen" hidden>
    <p class="muted" id="historyHint" style="margin:0 var(--s1) var(--s3)">
      種目名をタップすると、その種目だけの記録を見られます。
    </p>
    <div id="logList"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<!-- 図解の拡大 + 写真の登録 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <b id="modalTitle"></b>
      <button class="link" id="modalClose">閉じる</button>
    </div>
    <div class="modal-top">

</div>

const ART_FALLBACK = '<path class="s" d="M20 40v20M80 40v20M30 32v36M70 32v36M30 50h40"/>';

// ===== データの保存と読み込み =========================================
const STORAGE_KEY = "workout-logs-v1";   // トレーニング記録
const PHOTO_KEY   = "workout-photos-v1"; // 種目ごとのマシン写真

function loadLogs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function saveLogs(logs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  if (window.cloudSync) window.cloudSync();   // ログイン中ならクラウドにも反映
}
// 端末で削除した記録のid。同期のときにクラウドからも消すために覚えておく
const DELETED_KEY = "workout-deleted-v1";
function loadDeleted() {
  try { return JSON.parse(localStorage.getItem(DELETED_KEY)) || []; }
  catch (e) { return []; }
}
function markDeleted(id) {
  const list = loadDeleted();
  if (!list.includes(String(id))) list.push(String(id));
  localStorage.setItem(DELETED_KEY, JSON.stringify(list));
}

// 重量の刻み幅（種目ごと）。マシンによってプレートの刻みが違うので個別に覚える
const STEP_KEY = "workout-steps-v1";
const STEP_CHOICES = [1, 2.5, 5, 10, 20];
function loadSteps() {
  try { return JSON.parse(localStorage.getItem(STEP_KEY)) || {}; }
  catch (e) { return {}; }
}
function stepFor(name) {
  const v = loadSteps()[name];
  return STEP_CHOICES.includes(v) ? v : 2.5;
}
function cycleStep(name) {
  const steps = loadSteps();
  const i = STEP_CHOICES.indexOf(stepFor(name));
  steps[name] = STEP_CHOICES[(i + 1) % STEP_CHOICES.length];
  localStorage.setItem(STEP_KEY, JSON.stringify(steps));
  return steps[name];
}

const DELETED_PHOTO_KEY = "workout-deleted-photos-v1";
function loadDeletedPhotos() {
  try { return JSON.parse(localStorage.getItem(DELETED_PHOTO_KEY)) || []; }
  catch (e) { return []; }
}
function markPhotoDeleted(name) {
  const list = loadDeletedPhotos();
  if (!list.includes(name)) list.push(name);
  localStorage.setItem(DELETED_PHOTO_KEY, JSON.stringify(list));
}

function loadPhotos() {
  try { return JSON.parse(localStorage.getItem(PHOTO_KEY)) || {}; }
  catch (e) { return {}; }
}
function savePhotos(photos) {
  try {
    localStorage.setItem(PHOTO_KEY, JSON.stringify(photos));
    if (window.cloudSync) window.cloudSync();
    return true;
  } catch (e) {
    alert("保存容量がいっぱいです。使っていない種目の写真を削除してください。");
    return false;
  }
}
// 編集中に「前回」「自己ベスト」がその記録自身を指してしまわないよう、
// 対象のidを一時的に除外できるようにしておく（編集画面を離れたら必ずnullに戻す）
let excludeLogId = null;

// 日付の新しい順に並べた配列を返す
function sortedLogs() {
  return loadLogs()
    .filter(l => l.id !== excludeLogId)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function findLogById(id) {
  return loadLogs().find(l => l.id === id) || null;
}
// 種目名から、直近の記録（セット配列）を探す
function findLastRecord(exerciseName) {
  for (const log of sortedLogs()) {
    const found = (log.exercises || []).find(ex => ex.name === exerciseName);
    if (found && found.sets.length > 0) return { date: log.date, sets: found.sets };
  }
  return null;
}
// 写真があればそれを、なければ図解を返す
function artHTML(name, photos) {
  const photo = photos[name];
  if (photo) return '<img src="' + photo + '" alt="' + name + '">';
  return SVG_OPEN + (ART[name] || ART_FALLBACK) + '</svg>';
}

// 種目名から、メニュー内の定義（目標レップ・注記など）を探す
function findExerciseDef(name) {
  for (const id of MENU_ORDER) {
    const found = MENUS[id].exercises.find(e => e.name === name);
    if (found) return found;
  }
  return { name: name, target: "", note: "" };
}

// その種目の記録だけを、新しい順に取り出す
function exerciseHistory(name) {
  const rows = [];
  for (const log of sortedLogs()) {
    for (const ex of log.exercises) {
      if (ex.name !== name) continue;
      const best = bestOfSets(ex.sets);
      rows.push({ date: log.date, sets: ex.sets, est: best ? best.value : null });
    }
  }
  return rows;
}

// ===== 1RM推定 ========================================================
// Epley式: 1RM = 重量 × (1 + レップ数 / 30)
// 12回を超えると誤差が大きくなるので、そのときは参考値として扱う
const BODYWEIGHT_KEY = "workout-bodyweight-v1";
function loadBodyweight() {
  const v = Number(localStorage.getItem(BODYWEIGHT_KEY));
  return v > 0 ? v : 58;
}
function saveBodyweight(kg) {
  localStorage.setItem(BODYWEIGHT_KEY, String(kg));
}

function estimate1RM(weight, reps) {
  const w = Number(weight), r = Number(reps);
  if (!(w > 0) || !(r > 0)) return null;
  if (r === 1) return w;
  return Math.round(w * (1 + r / 30) * 10) / 10;
}
// セット配列の中で最も高い推定1RMを返す
function bestOfSets(sets) {
  let best = null;
  for (const set of sets) {
    const e = estimate1RM(set.weight, set.reps);
    if (e !== null && (best === null || e > best.value)) {
      best = { value: e, weight: Number(set.weight), reps: Number(set.reps) };
    }
  }
  return best;
}
// 過去の全記録から、その種目の自己ベスト（推定1RM）を探す
function personalBest(exerciseName) {
  let best = null;
  for (const log of loadLogs()) {
    for (const ex of log.exercises) {
      if (ex.name !== exerciseName) continue;
      const b = bestOfSets(ex.sets);
      if (b && (best === null || b.value > best.value)) best = { ...b, date: log.date };
    }
  }
  return best;
}

// ===== 小さなユーティリティ ===========================================
// "3×8〜10" → { sets: 3, repMax: 10 }
function parseTarget(target) {
  const [setPart, repPart] = target.split("×");
  const reps = repPart.split("〜").map(Number);
  return { sets: Number(setPart), repMax: Math.max(...reps) };
}
function todayString() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  const week = "日月火水木金土"[new Date(iso + "T00:00:00").getDay()];
  return Number(m) + "/" + Number(d) + "（" + week + "）";
}
// 保存した時刻（savedAt の ISO文字列）を "19:32" の形にする。
// 古い記録には savedAt が無いので、その場合は空文字を返す
function formatTime(savedAt) {
  if (!savedAt) return "";
  const d = new Date(savedAt);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes());
}
// セット配列 → "30kg × 10,10,8"（重量が混在する場合は "30kg×10, 32.5kg×8"）
function formatSets(sets) {
  const weights = [...new Set(sets.map(s => s.weight))];
  if (weights.length === 1) {
    const w = weights[0] === null ? "自重" : weights[0] + "kg";
    return w + " × " + sets.map(s => s.reps).join(",");
  }
  return sets.map(s => (s.weight === null ? "自重" : s.weight + "kg") + "×" + s.reps).join(", ");
}
function totalVolume(exercises) {
  let v = 0;
  for (const ex of exercises) for (const s of ex.sets) v += (s.weight || 0) * s.reps;
  return v;
}

// ===== 画面の切り替え =================================================
const screens = {
  home:     document.getElementById("homeScreen"),
  workout:  document.getElementById("workoutScreen"),
  history:  document.getElementById("historyScreen"),
  settings: document.getElementById("settingsScreen")
};
const titleEl    = document.getElementById("title");
const backBtn    = document.getElementById("backBtn");
const historyBtn = document.getElementById("historyBtn");
const settingsBtn = document.getElementById("settingsBtn");

// ホームを起点(0)、その先の画面を(1)として、進む/戻るの向きを決める
const SCREEN_DEPTH = { home: 0, workout: 1, history: 1, settings: 1 };
let currentScreen = "home";

function showScreen(name, title) {
  const isFirst = (name === currentScreen && name === "home");
  const forward = SCREEN_DEPTH[name] > SCREEN_DEPTH[currentScreen];

  for (const key in screens) screens[key].hidden = (key !== name);
  titleEl.textContent = title;
  backBtn.hidden = (name === "home");
  historyBtn.hidden = (name !== "home");
  settingsBtn.hidden = (name !== "home");
  window.scrollTo(0, 0);

  if (!isFirst) {
    replay(screens[name], forward ? "push-in" : "pop-in");
    replay(titleEl, "changed");
  }
  currentScreen = name;
}

// 同じアニメーションを繰り返し再生するには、一度外して再描画を挟む必要がある
function replay(el, className) {
  el.classList.remove(className);
  void el.offsetWidth;
  el.classList.add(className);
}
// ===== ブラウザの履歴と連動 ==========================================
// マウスのサイドボタン、ブラウザの戻る/進む、Macのスワイプはすべて履歴操作なので、
// 画面の切り替えを history に積んでおかないとアプリごと離脱してしまう。
let currentState = { s: "home" };
let handlingPop = false;   // popstate 経由の描画では履歴を積み直さない

let replaceNext = false;   // 保存後のように、前の画面に戻したくないとき

function goTo(state) {
  if (!handlingPop) {
    if (replaceNext) history.replaceState(state, "");
    else history.pushState(state, "");
  }
  replaceNext = false;
  currentState = state;
}

function renderState(state) {
  const s = (state && state.s) || "home";
  if (s === "workout" && MENUS[state.menu]) {
    renderWorkout(state.menu, state.editId ? findLogById(state.editId) : null);
  }
  else if (s === "history") renderHistory();
  else if (s === "settings") renderSettings();
  else renderHome();
}

window.addEventListener("popstate", event => {
  handlingPop = true;
  const next = event.state || { s: "home" };

  // ポップアップを開いた状態で戻ったときは、閉じるだけにする（下の画面は作り直さない）
  if (currentState.s === "modal" && next.s === currentState.under) {
    closeModal();
    currentState = next;
  } else {
    if (!modal.hidden) closeModal();
    renderState(next);
    currentState = next;
  }
  handlingPop = false;
});

backBtn.onclick = () => history.back();
historyBtn.onclick = () => renderHistory();
settingsBtn.onclick = () => renderSettings();

function renderSettings() {
  excludeLogId = null;
  updateDataCard();
  goTo({ s: "settings" });
  showScreen("settings", "設定");
}

// ===== ホーム画面 =====================================================
function nextMenuId() {
  const logs = sortedLogs();
  if (logs.length === 0) return "A";
  const i = MENU_ORDER.indexOf(logs[0].menu);
  return MENU_ORDER[(i + 1) % MENU_ORDER.length];
}

// そのメニューを最後にやった日
function lastDoneOf(menuId) {
  const found = sortedLogs().find(l => l.menu === menuId);
  return found ? found.date : null;
}

function renderHome() {
  excludeLogId = null;
  const next = nextMenuId();
  const logs = sortedLogs();
  const list = document.getElementById("menuList");
  list.innerHTML = "";

  for (const id of MENU_ORDER) {
    const menu = MENUS[id];
    const last = lastDoneOf(id);
    const right = id === next
      ? '<span class="next-tag">次はこれ</span>'
      : (last ? '<span class="last">前回 ' + formatDate(last) + '</span>' : "");
    const btn = document.createElement("button");
    btn.className = "menu-btn card";
    btn.innerHTML =
      '<span class="badge">' + id + '</span>' +
      '<span class="t"><b>メニュー' + id + '</b><span>' + menu.title + '</span></span>' + right;
    btn.onclick = () => renderWorkout(id);
    list.appendChild(btn);
  }

  drawSummaryTiles(logs);
  goTo({ s: "home" });
  showScreen("home", "筋トレ記録");
}

function drawSummaryTiles(logs) {
  const box = document.getElementById("summaryTiles");
  if (logs.length === 0) {
    box.innerHTML =
      '<div class="tile" style="grid-column:1/-1">' +
      '<div class="label">はじめに</div>' +
      '<div class="value" style="font-size:var(--t-md)">メニューAから始めましょう</div>' +
      '<div class="foot">記録をつけると、前回の重量が自動で入ります</div></div>';
    return;
  }

  // 直近30日の回数と、前回の内容
  const since = new Date();
  since.setDate(since.getDate() - 30);
  const recent = logs.filter(l => new Date(l.date + "T00:00:00") >= since).length;
  const last = logs[0];
  const daysAgo = Math.round(
    (new Date(todayString() + "T00:00:00") - new Date(last.date + "T00:00:00")) / 86400000
  );

  box.innerHTML =
    '<div class="tile">' +
      '<div class="label">直近30日</div>' +
      '<div class="value">' + recent + '<small>回</small></div>' +
      '<div class="foot">全' + logs.length + '回の記録</div>' +
    '</div>' +
    '<div class="tile">' +
      '<div class="label">前回</div>' +
      '<div class="value">' + (daysAgo === 0 ? "今日" : daysAgo + '<small>日前</small>') + '</div>' +
      '<div class="foot">' + formatDate(last.date) + ' メニュー' + last.menu + '</div>' +
    '</div>';
}

// ===== データの書き出し・読み込み =====================================
const dataSummary = document.getElementById("dataSummary");
const storageInfo = document.getElementById("storageInfo");
const persistNote = document.getElementById("persistNote");

// ===== 表示テーマ =====================================================
// "auto"（OSに従う）/ "light" / "dark" の3つ。
const THEME_KEY = "workout-theme-v1";
const THEME_COLORS = { light: "#f5f6f8", dark: "#111418" };

function loadTheme() {
  const v = localStorage.getItem(THEME_KEY);
  return (v === "light" || v === "dark") ? v : "auto";
}

function applyTheme(theme) {
  if (theme === "auto") {
    delete document.documentElement.dataset.theme;
    localStorage.removeItem(THEME_KEY);
  } else {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
  }

  // ブラウザのアドレスバーやステータスバーの色も合わせる
  const effective = theme !== "auto" ? theme
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[effective];

  for (const btn of themeSeg.children) {
    btn.classList.toggle("on", btn.dataset.themeValue === theme);
  }
}

const themeSeg = document.getElementById("themeSeg");
for (const btn of themeSeg.children) {
  btn.onclick = () => applyTheme(btn.dataset.themeValue);
}
// OSの設定が変わったとき、「自動」なら追従させる
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (loadTheme() === "auto") applyTheme("auto");
});

const bodyweightInput = document.getElementById("bodyweightInput");
bodyweightInput.value = loadBodyweight();
bodyweightInput.onchange = () => {
  const v = Number(bodyweightInput.value);
  if (v > 0) saveBodyweight(v);
  bodyweightInput.value = loadBodyweight();
};

async function updateDataCard() {
  const logs = loadLogs();
  const photoCount = Object.keys(loadPhotos()).length;
  dataSummary.textContent =
    "記録 " + logs.length + "件 / マシン写真 " + photoCount + "枚" +
    "（このブラウザの中だけに保存されています）";

  if (navigator.storage && navigator.storage.estimate) {
    const est = await navigator.storage.estimate();
    storageInfo.textContent = Math.round((est.usage || 0) / 1024).toLocaleString() + " KB";
  }
}

// ブラウザに「容量が足りなくなってもこのデータは消さないで」と申請する
async function requestPersistentStorage() {
  if (!(navigator.storage && navigator.storage.persist)) {
    persistNote.textContent = "定期的に書き出してバックアップを取ってください。";
    return;
  }
  const granted = await navigator.storage.persisted() || await navigator.storage.persist();
  persistNote.textContent = granted
    ? "✓ このブラウザがデータを保持する設定になっています。"
    : "※ 容量不足時にブラウザがデータを消す可能性があります。定期的に書き出してください。";
}

document.getElementById("exportBtn").onclick = () => {
  const data = {
    app: "workout-log",
    version: 1,
    exportedAt: new Date().toISOString(),
    logs: loadLogs(),
    photos: loadPhotos()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "workout-backup-" + todayString() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("書き出しました", a.download);
};

document.getElementById("importInput").onchange = event => {
  const file = event.target.files[0];
  event.target.value = "";   // 同じファイルを選び直せるようにする
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      alert("読み込めませんでした。書き出したJSONファイルを選んでください。");
      return;
    }
    if (!data || !Array.isArray(data.logs)) {
      alert("このアプリのバックアップファイルではないようです。");
      return;
    }

    // 既にある記録はそのまま。同じidが無いものだけを足す（マージ）
    const current = loadLogs();
    const known = new Set(current.map(l => l.id));
    const newLogs = data.logs.filter(l => l && !known.has(l.id));

    const photos = loadPhotos();
    let newPhotos = 0;
    for (const name in (data.photos || {})) {
      if (!photos[name]) { photos[name] = data.photos[name]; newPhotos++; }
    }

    if (newLogs.length === 0 && newPhotos === 0) {
      alert("追加できる新しいデータはありませんでした。");
      return;
    }
    if (!confirm("記録 " + newLogs.length + "件、写真 " + newPhotos + "枚を追加します。\n" +
                 "今ある記録は消えません。よろしいですか？")) return;

    saveLogs(current.concat(newLogs));
    savePhotos(photos);
    renderHome();
    updateDataCard();
    showToast("読み込みました",
              "記録 " + newLogs.length + "件 / 写真 " + newPhotos + "枚を追加");
  };
  reader.readAsText(file);
};

// ===== 記録画面 =======================================================
let draft = null;      // 入力中のワークアウト
let currentMenu = null;

function renderWorkout(menuId, editLog) {
  const menu = MENUS[menuId];
  currentMenu = menu;

  // 入力途中で画面を離れても消えないよう、同じ編集対象なら下書きを引き継ぐ
  const hasInput = draft && draft.exercises.some(
    ex => ex.sets.some(set => set.reps !== "" && Number(set.reps) > 0)
  );
  const sameTarget = draft && draft.menu === menuId &&
    (draft.editingId || null) === (editLog ? editLog.id : null);

  if (hasInput && sameTarget) {
    document.getElementById("dateInput").value = draft.date;
    document.getElementById("dateInput").onchange = e => { draft.date = e.target.value; };
    const memo = document.getElementById("memoInput");
    memo.value = draft.memo;
    memo.oninput = e => { draft.memo = e.target.value; };
    document.getElementById("saveBtn").textContent = draft.editingId ? "この内容で更新" : "この内容で保存";
    excludeLogId = editLog ? editLog.id : null;
    drawExercises();
    goTo({ s: "workout", menu: menuId, editId: editLog ? editLog.id : undefined });
    showScreen("workout", "メニュー" + menuId);
    updateProgress();
    return;
  }
  if (hasInput && !confirm(
    editLog ? "入力中の内容が保存されていません。破棄してこの記録を編集しますか？"
            : "入力中の内容が保存されていません。破棄して別のメニューを開きますか？"
  )) {
    return;
  }

  // 除外は findLastRecord など各所から参照されるので、draft を組み立てる前に切り替える
  excludeLogId = editLog ? editLog.id : null;

  draft = {
    date: editLog ? editLog.date : todayString(),
    menu: menuId,
    memo: editLog ? (editLog.memo || "") : "",
    editingId: editLog ? editLog.id : null,
    exercises: menu.exercises.map(def => {
      // 編集中の記録にその種目があれば、実際の値をそのまま使う
      const fromLog = editLog && editLog.exercises.find(ex => ex.name === def.name);
      if (fromLog) {
        return {
          name: def.name,
          sets: fromLog.sets.map(s => ({
            weight: s.weight === null ? "" : String(s.weight),
            reps: String(s.reps)
          }))
        };
      }
      const last = findLastRecord(def.name);
      const setCount = parseTarget(def.target).sets;
      // 前回と同じ重量を初期値に入れておく（毎回打ち直さなくて済む）
      const prefill = last ? last.sets[0].weight : "";
      return {
        name: def.name,
        sets: Array.from({ length: setCount }, () => ({ weight: prefill, reps: "" }))
      };
    })
  };

  const dateInput = document.getElementById("dateInput");
  dateInput.value = draft.date;
  dateInput.onchange = e => { draft.date = e.target.value; };
  const memoInput = document.getElementById("memoInput");
  memoInput.value = draft.memo;
  memoInput.oninput = e => { draft.memo = e.target.value; };
  document.getElementById("saveBtn").textContent = editLog ? "この内容で更新" : "この内容で保存";

  drawExercises();
  goTo({ s: "workout", menu: menuId, editId: editLog ? editLog.id : undefined });
  showScreen("workout", "メニュー" + menuId);
  updateProgress();
}

// ヘッダーのタイトルに進捗を出す（メニューC 3/7 のように。編集中は先頭に明記する）
function updateProgress() {
  if (!draft) return;
  const done = draft.exercises.filter(
    ex => ex.sets.some(s => s.reps !== "" && Number(s.reps) > 0)
  ).length;
  const prefix = draft.editingId ? "編集：" : "";
  titleEl.innerHTML = prefix + "メニュー" + draft.menu +
    '<span class="count">' + done + " / " + draft.exercises.length + "</span>";
}

function drawExercises() {
  const container = document.getElementById("exerciseList");
  const photos = loadPhotos();
  container.innerHTML = "";

  currentMenu.exercises.forEach((def, exIndex) => {
    const card = document.createElement("div");
    card.className = "card";

    // --- 図解 + 種目名 ---
    const top = document.createElement("div");
    top.className = "ex-top";

    const art = document.createElement("button");
    art.className = "illust";
    art.title = "タップで拡大 / 写真を登録";
    art.innerHTML = artHTML(def.name, photos);
    art.onclick = () => openArtModal(def);
    top.appendChild(art);

    const info = document.createElement("div");
    info.className = "ex-info";
    const last = findLastRecord(def.name);
    info.innerHTML =
      '<div class="ex-head"><b>' + def.name + '</b>' +
      '<span class="done" hidden>' + icon("check") + '</span>' +
      '<span class="target">' + def.target + '</span></div>' +
      '<div class="prev' + (last ? '' : ' none') + '">' +
      (last ? "前回 " + formatDate(last.date) + "　" + formatSets(last.sets)
            : (def.note || "初回：軽めの重量で軌道を確認")) +
      '</div>';
    top.appendChild(info);
    card.appendChild(top);

    const setsBox = document.createElement("div");
    card.appendChild(setsBox);

    const est = document.createElement("div");
    est.className = "est";
    est.hidden = true;
    card.appendChild(est);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.hidden = true;
    card.appendChild(hint);

    // この種目に1セットでも入力があれば「済」にする
    function updateDone() {
      const done = draft.exercises[exIndex].sets.some(s => s.reps !== "" && Number(s.reps) > 0);
      card.classList.toggle("finished", done);
      card.querySelector(".done").hidden = !done;
    }

    // 入力中の内容から推定1RMを出し、自己ベストと比べる
    function updateEstimate() {
      const best = bestOfSets(draft.exercises[exIndex].sets);
      const pb = personalBest(def.name);

      if (!best) {
        // まだ入力が無いときは、自己ベストだけ出しておく
        if (pb) {
          est.hidden = false;
          est.innerHTML = "自己ベスト <b>" + pb.value + "kg</b>" +
            "（" + formatDate(pb.date) + " " + pb.weight + "kg×" + pb.reps + "）";
        } else {
          est.hidden = true;
        }
        return;
      }

      est.hidden = false;
      let html = "推定1RM <b>" + best.value + "kg</b>";
      if (def.ratio) {
        html += "（体重比 " + (best.value / loadBodyweight()).toFixed(2) + "倍）";
      }
      if (pb) {
        html += best.value > pb.value
          ? ' <span class="pb">自己ベスト更新（前 ' + pb.value + 'kg）</span>'
          : "　自己ベスト " + pb.value + "kg";
      }
      if (best.reps > 12) html += "<br>※13回以上からの推定は誤差が大きめです";
      est.innerHTML = html;
    }

    // 目標レップを全セット達成できたら増量をすすめる
    function updateHint() {
      const { sets: targetSets, repMax } = parseTarget(def.target);
      const done = draft.exercises[exIndex].sets.filter(s => s.reps !== "" && Number(s.reps) > 0);
      const cleared = done.length >= targetSets && done.every(s => Number(s.reps) >= repMax);
      hint.hidden = !cleared;
      if (cleared) hint.textContent = "全セット完遂 ✓ 次回は 2.5〜5kg 上げてOK";
    }

    // − / ＋ を押したときの重量の増減
    function adjustWeight(setIndex, direction) {
      const sets = draft.exercises[exIndex].sets;
      const before = Number(sets[setIndex].weight || 0);
      const step = stepFor(def.name);
      const after = Math.max(0, Math.round((before + direction * step) * 100) / 100);

      // まだ回数を入れていない後続セットが同じ重量なら、まとめて合わせる
      for (let j = setIndex + 1; j < sets.length; j++) {
        if (sets[j].reps === "" && Number(sets[j].weight || 0) === before) {
          sets[j].weight = String(after);
        }
      }
      sets[setIndex].weight = String(after);
      drawSets();
      updateHint();
      updateEstimate();
    }

    function drawSets() {
      setsBox.innerHTML = "";
      draft.exercises[exIndex].sets.forEach((set, setIndex) => {
        const row = document.createElement("div");
        row.className = "set";

        const no = document.createElement("span");
        no.className = "no";
        no.textContent = (setIndex + 1) + ".";
        row.appendChild(no);

        const minus = document.createElement("button");
        minus.className = "step-btn"; minus.innerHTML = icon("minus");
        minus.setAttribute("aria-label", "重量を下げる");
        minus.onclick = () => adjustWeight(setIndex, -1);
        row.appendChild(minus);

        const wField = document.createElement("span");
        wField.className = "f w";
        const w = document.createElement("input");
        w.type = "number"; w.inputMode = "decimal"; w.step = "0.5"; w.min = "0";
        w.placeholder = "重量"; w.value = set.weight;
        w.oninput = () => { set.weight = w.value; updateEstimate(); };
        wField.appendChild(w);
        const wUnit = document.createElement("span");
        wUnit.className = "unit"; wUnit.textContent = "kg";
        wField.appendChild(wUnit);
        row.appendChild(wField);

        const plus = document.createElement("button");
        plus.className = "step-btn"; plus.innerHTML = icon("plus");
        plus.setAttribute("aria-label", "重量を上げる");
        plus.onclick = () => adjustWeight(setIndex, 1);
        row.appendChild(plus);

        const rField = document.createElement("span");
        rField.className = "f r";
        const r = document.createElement("input");
        r.type = "number"; r.inputMode = "numeric"; r.min = "0";
        r.placeholder = "回数"; r.value = set.reps;
        r.oninput = () => {
          set.reps = r.value;
          updateHint(); updateEstimate(); updateDone(); updateProgress();
        };
        rField.appendChild(r);
        const rUnit = document.createElement("span");
        rUnit.className = "unit"; rUnit.textContent = "回";
        rField.appendChild(rUnit);
        row.appendChild(rField);

        const del = document.createElement("button");
        del.className = "del"; del.innerHTML = icon("close");
        del.title = "このセットを削除"; del.setAttribute("aria-label", "このセットを削除");
        del.onclick = () => {
          // 入力済みのセットは打ち直しになるので、消す前に確認する
          if (set.reps !== "" &&
              !confirm((setIndex + 1) + "セット目（" +
                       (set.weight || 0) + "kg × " + set.reps + "回）を削除しますか？")) return;
          draft.exercises[exIndex].sets.splice(setIndex, 1);
          drawSets(); updateHint(); updateEstimate(); updateProgress();
        };
        row.appendChild(del);

        setsBox.appendChild(row);
      });

      const footer = document.createElement("div");
      footer.className = "set-foot";

      const add = document.createElement("button");
      add.className = "link";
      add.innerHTML = icon("plus") + '<span style="margin-left:4px">セットを追加</span>';
      add.style.display = "inline-flex";
      add.style.alignItems = "center";
      add.onclick = () => {
        const sets = draft.exercises[exIndex].sets;
        const lastSet = sets[sets.length - 1];
        sets.push({ weight: lastSet ? lastSet.weight : "", reps: "" });
        drawSets(); updateHint();
      };
      footer.appendChild(add);

      const pick = document.createElement("button");
      pick.className = "step-pick";
      pick.textContent = "刻み " + stepFor(def.name) + "kg";
      pick.title = "タップで切り替え";
      pick.onclick = () => { cycleStep(def.name); drawSets(); };
      footer.appendChild(pick);

      setsBox.appendChild(footer);
    }

    drawSets();
    updateEstimate();
    updateDone();
    container.appendChild(card);
  });
}

document.getElementById("saveBtn").onclick = () => {
  // 回数が入っているセットだけを残す
  const exercises = draft.exercises
    .map(ex => ({
      name: ex.name,
      sets: ex.sets
        .filter(s => s.reps !== "" && Number(s.reps) > 0)
        .map(s => ({
          weight: s.weight === "" ? null : Number(s.weight),
          reps: Number(s.reps)
        }))
    }))
    .filter(ex => ex.sets.length > 0);

  if (exercises.length === 0) {
    alert("記録するセットがありません。回数を入力してください。");
    return;
  }

  const logs = loadLogs();
  const isEdit = !!draft.editingId;
  const savedMenu = draft.menu;

  if (isEdit) {
    const idx = logs.findIndex(l => l.id === draft.editingId);
    if (idx === -1) {
      // 編集中に別の場所（他端末の同期など）で削除された場合
      alert("この記録は既に削除されているため、更新できませんでした。");
      return;
    }
    logs[idx] = {
      ...logs[idx],
      date: draft.date,
      memo: draft.memo,
      exercises: exercises,
      editedAt: new Date().toISOString()   // 元の savedAt は保ち、編集した事実だけ加える
    };
  } else {
    logs.push({
      id: Date.now(),
      date: draft.date,
      savedAt: new Date().toISOString(),   // 保存した時刻（実施日とは別。実施日は編集できるため）
      menu: draft.menu,
      memo: draft.memo,
      exercises: exercises
    });
  }
  saveLogs(logs);

  const setCount = exercises.reduce((n, ex) => n + ex.sets.length, 0);
  draft = null;             // 保存済みなので下書きは破棄する
  excludeLogId = null;
  replaceNext = true;       // 保存した記録画面へは戻さない
  renderHome();
  showToast(
    "メニュー" + savedMenu + (isEdit ? " を更新しました" : " を記録しました"),
    exercises.length + "種目 / " + setCount + "セット / 総挙上量 " +
      totalVolume(exercises).toLocaleString() + "kg"
  );
};

// ===== 図解の拡大 + 写真の登録 ========================================
const modal        = document.getElementById("modal");
const modalTitle   = document.getElementById("modalTitle");
const modalIllust  = document.getElementById("modalIllust");
const modalNote    = document.getElementById("modalNote");
const photoInput   = document.getElementById("photoInput");
const photoDelete  = document.getElementById("photoDelete");
let modalExercise  = null;

function openArtModal(def) {
  modalExercise = def;
  drawModal();
  modal.hidden = false;
  // 戻る操作でポップアップだけを閉じられるようにする
  const under = currentState.s;
  history.pushState({ s: "modal", under: under }, "");
  currentState = { s: "modal", under: under };
}
function drawModal() {
  // 図解はタップで大きくできる（初回は小さく出して履歴を優先する）
  modalIllust.onclick = () => modalIllust.classList.toggle("zoom");
  modalIllust.title = "タップで拡大";
  const photos = loadPhotos();
  const hasPhoto = !!photos[modalExercise.name];
  modalTitle.textContent = modalExercise.name;
  modalIllust.innerHTML = artHTML(modalExercise.name, photos);
  modalNote.textContent = hasPhoto
    ? modalExercise.note
    : (modalExercise.note ? modalExercise.note + " / " : "") +
      "ジムで実物の写真を撮って登録すると、この図の代わりに表示されます。";
  photoDelete.hidden = !hasPhoto;
  drawModalHistory();
}

const MAX_HISTORY_ROWS = 30;

function drawModalHistory() {
  const box = document.getElementById("modalHistory");
  const rows = exerciseHistory(modalExercise.name);
  box.innerHTML = "";

  const heading = document.createElement("h4");
  heading.textContent = "この種目の記録";
  box.appendChild(heading);

  if (rows.length === 0) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.style.margin = "0";
    empty.textContent = "まだ記録がありません。";
    box.appendChild(empty);
    return;
  }

  const bestValue = Math.max(...rows.map(r => r.est || 0));

  rows.slice(0, MAX_HISTORY_ROWS).forEach(row => {
    const isBest = row.est !== null && row.est === bestValue;
    const el = document.createElement("div");
    el.className = "hist-row" + (isBest ? " best" : "");
    el.innerHTML =
      '<span class="d">' + formatDate(row.date) + '</span>' +
      '<span class="v">' + formatSets(row.sets) + '</span>' +
      '<span class="e">' + (row.est !== null ? row.est + "kg" + (isBest ? " ★" : "") : "") + '</span>';
    box.appendChild(el);
  });

  const footer = document.createElement("p");
  footer.className = "muted";
  footer.style.margin = "8px 0 0";
  footer.textContent = rows.length > MAX_HISTORY_ROWS
    ? "右端は推定1RM。★が自己ベスト。直近" + MAX_HISTORY_ROWS + "件を表示（全" + rows.length + "件）"
    : "右端は推定1RM。★が自己ベストです。";
  box.appendChild(footer);
}
function closeModal() {
  modal.classList.add("closing");
  const finish = () => {
    modal.hidden = true;
    modal.classList.remove("closing");
    modalExercise = null;
  };
  // アニメーションを切っている環境では animationend が来ないので保険をかける
  const timer = setTimeout(finish, 700);
  modal.addEventListener("animationend", () => { clearTimeout(timer); finish(); }, { once: true });
}
// 閉じる操作は履歴を1つ戻す形にして、戻るボタンと挙動を揃える
function dismissModal() {
  if (currentState.s === "modal") history.back();
  else closeModal();
}
document.getElementById("modalClose").onclick = dismissModal;
modal.onclick = e => { if (e.target === modal) dismissModal(); };

// 選んだ画像を縮小してから localStorage に保存する（そのままだと容量を超える）
photoInput.onchange = () => {
  const file = photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 640;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

      const photos = loadPhotos();
      photos[modalExercise.name] = canvas.toDataURL("image/jpeg", 0.7);
      localStorage.setItem(DELETED_PHOTO_KEY,
        JSON.stringify(loadDeletedPhotos().filter(n => n !== modalExercise.name)));
      if (savePhotos(photos)) {
        drawModal();
        drawExercises();
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = ""; // 同じ写真を選び直せるようにリセット
};

photoDelete.onclick = () => {
  const photos = loadPhotos();
  markPhotoDeleted(modalExercise.name);
  delete photos[modalExercise.name];
  savePhotos(photos);
  drawModal();
  drawExercises();
};

// ===== 履歴画面 =======================================================
function renderHistory() {
  excludeLogId = null;
  const container = document.getElementById("logList");
  container.innerHTML = "";
  const logs = sortedLogs();

  document.getElementById("historyHint").hidden = (logs.length === 0);
  if (logs.length === 0) {
    container.innerHTML = '<p class="empty">まだ記録がありません。</p>';
  }

  for (const log of logs) {
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "log-head";
    head.innerHTML =
      '<b>' + formatDate(log.date) + ' メニュー' + log.menu + '</b>' +
      '<span class="vol">' + totalVolume(log.exercises).toLocaleString() + 'kg</span>';

    // 編集：内容を直して保存し直す（間違えて保存してしまったときの修正用）
    const edit = document.createElement("button");
    edit.className = "log-del";
    edit.innerHTML = icon("edit");
    edit.title = "この記録を編集";
    edit.setAttribute("aria-label", "この記録を編集");
    edit.onclick = () => renderWorkout(log.menu, log);
    head.appendChild(edit);

    // 削除は破壊的な操作なので、常時目立つ位置には置かない
    const del = document.createElement("button");
    del.className = "log-del log-trash";
    del.innerHTML = icon("trash");
    del.title = "この記録を削除";
    del.setAttribute("aria-label", "この記録を削除");
    del.onclick = () => {
      if (!confirm(formatDate(log.date) + " の記録を削除しますか？")) return;
      markDeleted(log.id);
      saveLogs(loadLogs().filter(l => l.id !== log.id));
      renderHistory();
    };
    head.appendChild(del);
    card.appendChild(head);

    const time = formatTime(log.savedAt);
    const editedTime = formatTime(log.editedAt);
    if (time) {
      const timeLine = document.createElement("div");
      timeLine.className = "log-time";
      timeLine.textContent = time + (editedTime ? "（編集 " + editedTime + "）" : "");
      card.appendChild(timeLine);
    }

    const body = document.createElement("div");
    body.className = "log-body";
    for (const ex of log.exercises) {
      const line = document.createElement("div");
      const name = document.createElement("button");
      name.className = "link";
      name.style.cssText = "padding:0;font-size:13px";
      name.textContent = ex.name;
      name.title = "この種目の記録を見る";
      name.onclick = () => openArtModal(findExerciseDef(ex.name));
      line.appendChild(name);
      line.appendChild(document.createTextNode(" " + formatSets(ex.sets)));
      body.appendChild(line);
    }
    card.appendChild(body);

    if (log.memo) {
      const memo = document.createElement("div");
      memo.className = "muted";
      memo.style.marginTop = "8px";
      memo.textContent = "メモ：" + log.memo;
      card.appendChild(memo);
    }

    container.appendChild(card);
  }
  goTo({ s: "history" });
  showScreen("history", "履歴");
}

// ===== 起動 ===========================================================
// 更新が端末に届いたかを確認するための版数。デプロイのたびに上げる。
const APP_VERSION = "2026-08-27.3";
document.getElementById("appVersion").textContent = APP_VERSION;

applyTheme(loadTheme());
history.replaceState({ s: "home" }, "");
renderHome();
requestPersistentStorage();

// オフラインでも開けるようにする（file:// で開いた場合は登録できないので黙って諦める）
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
