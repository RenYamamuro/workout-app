<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="description" content="A/B/C 3分割メニューのトレーニング記録アプリ">
<!-- ホーム画面に追加したときの挙動（iOS / Android / デスクトップ） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>筋トレ記録</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --accent-weak: #eaf0ff;
    --good: #15803d;
    --good-weak: #e7f6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --card: #1b1f25;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --line: #2b3138;
      --accent: #5b8cff;
      --accent-weak: #1d2740;
      --good: #6ee7a0;
      --good-weak: #16281e;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 0 40px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Noto Sans CJK JP",
                 Meiryo, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: max(env(safe-area-inset-top), 12px) 16px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; }

  button {
    font: inherit; cursor: pointer;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 10px 14px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: none; background: none; color: var(--accent); padding: 4px; }
  button:active { opacity: .7; }

  .menu-btn {
    width: 100%; text-align: left; padding: 14px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .menu-btn .badge {
    width: 34px; height: 34px; flex: none;
    border-radius: 9px; background: var(--accent-weak); color: var(--accent);
    display: grid; place-items: center; font-weight: 700; font-size: 16px;
  }
  .menu-btn .t { flex: 1; }
  .menu-btn .t b { display: block; font-size: 15px; }
  .menu-btn .t span { font-size: 12px; color: var(--muted); }
  .next-tag {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--accent);
    padding: 3px 7px; border-radius: 999px;
  }

  /* --- 種目カードの上部（図解 + 種目名） --- */
  .ex-top { display: flex; gap: 12px; margin-bottom: 10px; }
  .ex-info { flex: 1; min-width: 0; }
  .illust {
    width: 68px; height: 68px; flex: none;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg);
    overflow: hidden; padding: 0; cursor: pointer;
    display: grid; place-items: center;
  }
  .illust svg { width: 100%; height: 100%; display: block; fill: none;
                stroke-linecap: round; stroke-linejoin: round; }
  .illust img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .illust .s { stroke: var(--muted); stroke-width: 3; }   /* マシンの骨格 */
  .illust .p { stroke: var(--text);  stroke-width: 3; }   /* 人 */
  .illust .m { stroke: var(--accent); stroke-width: 4; }  /* 動く部分・負荷 */

  .ex-head { display: flex; align-items: baseline; gap: 8px; }
  .ex-head b { font-size: 15px; }
  .ex-head .target { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .prev { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .prev.none { font-style: italic; }
  .est {
    font-size: 12px; color: var(--muted);
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  }
  .est b { color: var(--text); font-size: 13px; }
  .est .pb { color: var(--good); }
  .bw-input {
    font: inherit; width: 90px; text-align: right;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  .hint {
    font-size: 12px; color: var(--good); background: var(--good-weak);
    border-radius: 8px; padding: 6px 8px; margin-top: 8px;
  }

  .set { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .set .no { width: 22px; font-size: 12px; color: var(--muted); }
  .set input {
    font: inherit; width: 100%; min-width: 0;
    padding: 9px 8px; text-align: right;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  .set .unit { font-size: 11px; color: var(--muted); flex: none; }
  .set .f { display: flex; align-items: center; gap: 3px; min-width: 0; }
  .set .w { flex: 1.35; }
  .set .r { flex: 1; }
  .set .step-btn {
    flex: none; width: 34px; padding: 9px 0;
    font-size: 17px; line-height: 1; font-weight: 600;
  }
  .step-pick {
    font-size: 12px; color: var(--accent);
    border: none; background: none; padding: 2px 4px; margin-left: auto;
  }

  input[type="date"], textarea {
    font: inherit; width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }

  .save-bar {
    position: sticky; bottom: 0;
    padding: 12px 0 max(env(safe-area-inset-bottom), 12px);
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
  }
  .save-bar button { width: 100%; padding: 14px; font-size: 16px; }

  .log-head { display: flex; align-items: baseline; gap: 8px; }
  .log-head b { font-size: 15px; }
  .log-body { font-size: 13px; margin-top: 8px; line-height: 1.7; }
  .log-body .n { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  /* --- 図解の拡大表示 --- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, .55);
    display: grid; place-items: center; padding: 16px;
  }
  .modal-card {
    background: var(--card); border-radius: 14px; padding: 16px;
    width: 100%; max-width: 360px;
  }
  .modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .modal-head b { font-size: 16px; flex: 1; }
  .illust.big {
    width: 100%; height: auto; aspect-ratio: 1 / 1; max-width: 260px;
    margin: 0 auto 12px; cursor: default;
  }
  .filebtn {
    display: inline-block; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font-size: 14px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <button id="backBtn" class="link" hidden>← 戻る</button>
  <h1 id="title">筋トレ記録</h1>
  <button id="historyBtn" class="link">履歴</button>
</header>

<main>
  <!-- ホーム画面 -->
  <section id="homeScreen">
    <p class="muted" style="margin-top:0">A → B → C の順に、行く日に次のメニューを実施します。</p>
    <div id="menuList"></div>
    <div class="card">
      <div class="muted" id="lastSummary"></div>
    </div>

    <div class="card" id="cloudCard" hidden>
      <div class="row" style="margin-bottom:6px">
        <b style="font-size:15px">クラウド同期</b>
        <span class="muted" id="cloudStatus" style="margin-left:auto"></span>
      </div>
      <p class="muted" id="cloudNote" style="margin:0 0 10px"></p>
      <div class="row">
        <button id="cloudSignIn">Googleでログイン</button>
        <button id="cloudSyncNow" hidden>今すぐ同期</button>
        <button class="link" id="cloudSignOut" hidden>ログアウト</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <b style="font-size:15px">データ</b>
        <span class="muted" id="storageInfo" style="margin-left:auto"></span>
      </div>
      <div class="row" style="margin-bottom:10px">
        <label class="muted" for="bodyweightInput">体重</label>
        <input type="number" inputmode="decimal" step="0.1" min="1"
               id="bodyweightInput" class="bw-input">
        <span class="muted">kg</span>
        <span class="muted" style="margin-left:auto">1RMの体重比に使います</span>
      </div>
      <p class="muted" id="dataSummary" style="margin:0 0 10px"></p>
      <div class="row">
        <button id="exportBtn">📥 書き出し</button>
        <label class="filebtn">
          📤 読み込み
          <input type="file" accept="application/json,.json" id="importInput" hidden>
        </label>
      </div>
      <p class="muted" id="persistNote" style="margin:10px 0 0"></p>
    </div>
  </section>

  <!-- 記録画面 -->
  <section id="workoutScreen" hidden>
    <div class="card">
      <label class="muted" for="dateInput">実施日</label>
      <input type="date" id="dateInput" style="margin-top:6px">
    </div>
    <div id="exerciseList"></div>
    <div class="card">
      <label class="muted" for="memoInput">メモ（体調・筋肉痛・気づいたことなど）</label>
      <textarea id="memoInput" placeholder="例）脚に筋肉痛が残っていたので軽め" style="margin-top:6px"></textarea>
    </div>
    <div class="save-bar">
      <button class="primary" id="saveBtn">この内容で保存</button>
    </div>
  </section>

  <!-- 履歴画面 -->
  <section id="historyScreen" hidden>
    <div id="logList"></div>
  </section>
</main>

<!-- 図解の拡大 + 写真の登録 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <b id="modalTitle"></b>
      <button class="link" id="modalClose">閉じる</button>
    </div>
    <div class="illust big" id="modalIllust"></div>
    <p class="muted" id="modalNote" style="margin-top:0"></p>
    <div class="row">
      <label class="filebtn">
        📷 実物の写真を登録
        <input type="file" accept="image/*" id="photoInput" hidden>
      </label>
      <button class="link" id="photoDelete" hidden>写真を削除</button>
    </div>
  </div>
</div>

// ===== データの保存と読み込み =========================================
const STORAGE_KEY = "workout-logs-v1";   // トレーニング記録
const PHOTO_KEY   = "workout-photos-v1"; // 種目ごとのマシン写真

function loadLogs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function saveLogs(logs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  if (window.cloudSync) window.cloudSync();   // ログイン中ならクラウドにも反映
}
// 端末で削除した記録のid。同期のときにクラウドからも消すために覚えておく
const DELETED_KEY = "workout-deleted-v1";
function loadDeleted() {
  try { return JSON.parse(localStorage.getItem(DELETED_KEY)) || []; }
  catch (e) { return []; }
}
function markDeleted(id) {
  const list = loadDeleted();
  if (!list.includes(String(id))) list.push(String(id));
  localStorage.setItem(DELETED_KEY, JSON.stringify(list));
}

// 重量の刻み幅（種目ごと）。マシンによってプレートの刻みが違うので個別に覚える
const STEP_KEY = "workout-steps-v1";
const STEP_CHOICES = [1, 2.5, 5, 10, 20];
function loadSteps() {
  try { return JSON.parse(localStorage.getItem(STEP_KEY)) || {}; }
  catch (e) { return {}; }
}
function stepFor(name) {
  const v = loadSteps()[name];
  return STEP_CHOICES.includes(v) ? v : 2.5;
}
function cycleStep(name) {
  const steps = loadSteps();
  const i = STEP_CHOICES.indexOf(stepFor(name));
  steps[name] = STEP_CHOICES[(i + 1) % STEP_CHOICES.length];
  localStorage.setItem(STEP_KEY, JSON.stringify(steps));
  return steps[name];
}

const DELETED_PHOTO_KEY = "workout-deleted-photos-v1";
function loadDeletedPhotos() {
  try { return JSON.parse(localStorage.getItem(DELETED_PHOTO_KEY)) || []; }
  catch (e) { return []; }
}
function markPhotoDeleted(name) {
  const list = loadDeletedPhotos();
  if (!list.includes(name)) list.push(name);
  localStorage.setItem(DELETED_PHOTO_KEY, JSON.stringify(list));
}

function loadPhotos() {
  try { return JSON.parse(localStorage.getItem(PHOTO_KEY)) || {}; }
  catch (e) { return {}; }
}
function savePhotos(photos) {
  try {
    localStorage.setItem(PHOTO_KEY, JSON.stringify(photos));
    if (window.cloudSync) window.cloudSync();
    return true;
  } catch (e) {
    alert("保存容量がいっぱいです。使っていない種目の写真を削除してください。");
    return false;
  }
}
// 日付の新しい順に並べた配列を返す
function sortedLogs() {
  return loadLogs().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
// 種目名から、直近の記録（セット配列）を探す
function findLastRecord(exerciseName) {
  for (const log of sortedLogs()) {
    const found = (log.exercises || []).find(ex => ex.name === exerciseName);
    if (found && found.sets.length > 0) return { date: log.date, sets: found.sets };
  }
  return null;
}
// 写真があればそれを、なければ図解を返す
function artHTML(name, photos) {
  const photo = photos[name];
  if (photo) return '<img src="' + photo + '" alt="' + name + '">';
  return SVG_OPEN + (ART[name] || ART_FALLBACK) + '</svg>';
}

// ===== 1RM推定 ========================================================
// Epley式: 1RM = 重量 × (1 + レップ数 / 30)
// 12回を超えると誤差が大きくなるので、そのときは参考値として扱う
const BODYWEIGHT_KEY = "workout-bodyweight-v1";
function loadBodyweight() {
  const v = Number(localStorage.getItem(BODYWEIGHT_KEY));
  return v > 0 ? v : 58;
}
function saveBodyweight(kg) {
  localStorage.setItem(BODYWEIGHT_KEY, String(kg));
}

function estimate1RM(weight, reps) {
  const w = Number(weight), r = Number(reps);
  if (!(w > 0) || !(r > 0)) return null;
  if (r === 1) return w;
  return Math.round(w * (1 + r / 30) * 10) / 10;
}
// セット配列の中で最も高い推定1RMを返す
function bestOfSets(sets) {
  let best = null;
  for (const set of sets) {
    const e = estimate1RM(set.weight, set.reps);
    if (e !== null && (best === null || e > best.value)) {
      best = { value: e, weight: Number(set.weight), reps: Number(set.reps) };
    }
  }
  return best;
}
// 過去の全記録から、その種目の自己ベスト（推定1RM）を探す
function personalBest(exerciseName) {
  let best = null;
  for (const log of loadLogs()) {
    for (const ex of log.exercises) {
      if (ex.name !== exerciseName) continue;
      const b = bestOfSets(ex.sets);
      if (b && (best === null || b.value > best.value)) best = { ...b, date: log.date };
    }
  }
  return best;
}

// ===== 小さなユーティリティ ===========================================
// "3×8〜10" → { sets: 3, repMax: 10 }
function parseTarget(target) {
  const [setPart, repPart] = target.split("×");
  const reps = repPart.split("〜").map(Number);
  return { sets: Number(setPart), repMax: Math.max(...reps) };
}
function todayString() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  const week = "日月火水木金土"[new Date(iso + "T00:00:00").getDay()];
  return Number(m) + "/" + Number(d) + "（" + week + "）";
}
// セット配列 → "30kg × 10,10,8"（重量が混在する場合は "30kg×10, 32.5kg×8"）
function formatSets(sets) {
  const weights = [...new Set(sets.map(s => s.weight))];
  if (weights.length === 1) {
    const w = weights[0] === null ? "自重" : weights[0] + "kg";
    return w + " × " + sets.map(s => s.reps).join(",");
  }
  return sets.map(s => (s.weight === null ? "自重" : s.weight + "kg") + "×" + s.reps).join(", ");
}
function totalVolume(exercises) {
  let v = 0;
  for (const ex of exercises) for (const s of ex.sets) v += (s.weight || 0) * s.reps;
  return v;
}

function nextMenuId() {

  const i = MENU_ORDER.indexOf(logs[0].menu);
  return MENU_ORDER[(i + 1) % MENU_ORDER.length];
}

function renderHome() {
  const next = nextMenuId();

const dataSummary = document.getElementById("dataSummary");
const storageInfo = document.getElementById("storageInfo");

bodyweightInput.value = loadBodyweight();
bodyweightInput.onchange = () => {
  const v = Number(bodyweightInput.value);
  if (v > 0) saveBodyweight(v);
  bodyweightInput.value = loadBodyweight();
};

async function updateDataCard() {
  const logs = loadLogs();
  const photoCount = Object.keys(loadPhotos()).length;
  dataSummary.textContent =
    "記録 " + logs.length + "件 / マシン写真 " + photoCount + "枚" +
    "（このブラウザの中だけに保存されています）";

  if (navigator.storage && navigator.storage.estimate) {
    const est = await navigator.storage.estimate();
    storageInfo.textContent = Math.round((est.usage || 0) / 1024).toLocaleString() + " KB";
  }
}

// ブラウザに「容量が足りなくなってもこのデータは消さないで」と申請する
async function requestPersistentStorage() {
  if (!(navigator.storage && navigator.storage.persist)) {
    persistNote.textContent = "定期的に書き出してバックアップを取ってください。";
    return;
  }
  const granted = await navigator.storage.persisted() || await navigator.storage.persist();
  persistNote.textContent = granted
    ? "✓ このブラウザがデータを保持する設定になっています。"
    : "※ 容量不足時にブラウザがデータを消す可能性があります。定期的に書き出してください。";
}

document.getElementById("exportBtn").onclick = () => {
  const data = {
    app: "workout-log",
    version: 1,
    exportedAt: new Date().toISOString(),
    logs: loadLogs(),
    photos: loadPhotos()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "workout-backup-" + todayString() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

document.getElementById("importInput").onchange = event => {
  const file = event.target.files[0];
  event.target.value = "";   // 同じファイルを選び直せるようにする
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      alert("読み込めませんでした。書き出したJSONファイルを選んでください。");
      return;
    }
    if (!data || !Array.isArray(data.logs)) {
      alert("このアプリのバックアップファイルではないようです。");
      return;
    }

    // 既にある記録はそのまま。同じidが無いものだけを足す（マージ）
    const current = loadLogs();
    const known = new Set(current.map(l => l.id));
    const newLogs = data.logs.filter(l => l && !known.has(l.id));

    const photos = loadPhotos();
    let newPhotos = 0;
    for (const name in (data.photos || {})) {
      if (!photos[name]) { photos[name] = data.photos[name]; newPhotos++; }
    }

    if (newLogs.length === 0 && newPhotos === 0) {
      alert("追加できる新しいデータはありませんでした。");
      return;
    }
    if (!confirm("記録 " + newLogs.length + "件、写真 " + newPhotos + "枚を追加します。\n" +
                 "今ある記録は消えません。よろしいですか？")) return;

    saveLogs(current.concat(newLogs));
    savePhotos(photos);
    renderHome();
    alert("読み込みました。");
  };
  reader.readAsText(file);
};

// ===== 記録画面 =======================================================
let draft = null;      // 入力中のワークアウト
let currentMenu = null;

function renderWorkout(menuId) {
  const menu = MENUS[menuId];
  currentMenu = menu;
  draft = {
    date: todayString(),
    menu: menuId,
    memo: "",
    exercises: menu.exercises.map(def => {
      const last = findLastRecord(def.name);
      const setCount = parseTarget(def.target).sets;
      // 前回と同じ重量を初期値に入れておく（毎回打ち直さなくて済む）
      const prefill = last ? last.sets[0].weight : "";
      return {
        name: def.name,
        sets: Array.from({ length: setCount }, () => ({ weight: prefill, reps: "" }))
      };
    })
  };

  const dateInput = document.getElementById("dateInput");
  dateInput.value = draft.date;
  dateInput.onchange = e => { draft.date = e.target.value; };
  const memoInput = document.getElementById("memoInput");
  memoInput.value = "";
  memoInput.oninput = e => { draft.memo = e.target.value; };

  drawExercises();
  showScreen("workout", "メニュー" + menuId);
}

function drawExercises() {
  const container = document.getElementById("exerciseList");
  const photos = loadPhotos();
  container.innerHTML = "";

  currentMenu.exercises.forEach((def, exIndex) => {
    const card = document.createElement("div");
    card.className = "card";

    // --- 図解 + 種目名 ---
    const top = document.createElement("div");
    top.className = "ex-top";

    const art = document.createElement("button");
    art.className = "illust";
    art.title = "タップで拡大 / 写真を登録";
    art.innerHTML = artHTML(def.name, photos);
    art.onclick = () => openArtModal(def);
    top.appendChild(art);

    const info = document.createElement("div");
    info.className = "ex-info";
    const last = findLastRecord(def.name);
    info.innerHTML =
      '<div class="ex-head"><b>' + def.name + '</b>' +
      '<span class="target">' + def.target + '</span></div>' +
      '<div class="prev' + (last ? '' : ' none') + '">' +
      (last ? "前回 " + formatDate(last.date) + "　" + formatSets(last.sets)
            : (def.note || "初回：軽めの重量で軌道を確認")) +
      '</div>';
    top.appendChild(info);
    card.appendChild(top);

    const setsBox = document.createElement("div");
    card.appendChild(setsBox);

    const est = document.createElement("div");
    est.className = "est";
    est.hidden = true;
    card.appendChild(est);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.hidden = true;
    card.appendChild(hint);

    // 入力中の内容から推定1RMを出し、自己ベストと比べる
    function updateEstimate() {
      const best = bestOfSets(draft.exercises[exIndex].sets);
      const pb = personalBest(def.name);

      if (!best) {
        // まだ入力が無いときは、自己ベストだけ出しておく
        if (pb) {
          est.hidden = false;
          est.innerHTML = "自己ベスト <b>" + pb.value + "kg</b>" +
            "（" + formatDate(pb.date) + " " + pb.weight + "kg×" + pb.reps + "）";
        } else {
          est.hidden = true;
        }
        return;
      }

      est.hidden = false;
      let html = "推定1RM <b>" + best.value + "kg</b>";
      if (def.ratio) {
        html += "（体重比 " + (best.value / loadBodyweight()).toFixed(2) + "倍）";
      }
      if (pb) {
        html += best.value > pb.value
          ? ' <span class="pb">自己ベスト更新（前 ' + pb.value + 'kg）</span>'
          : "　自己ベスト " + pb.value + "kg";
      }
      if (best.reps > 12) html += "<br>※13回以上からの推定は誤差が大きめです";
      est.innerHTML = html;
    }

    // 目標レップを全セット達成できたら増量をすすめる
    function updateHint() {
      const { sets: targetSets, repMax } = parseTarget(def.target);
      const done = draft.exercises[exIndex].sets.filter(s => s.reps !== "" && Number(s.reps) > 0);
      const cleared = done.length >= targetSets && done.every(s => Number(s.reps) >= repMax);
      hint.hidden = !cleared;
      if (cleared) hint.textContent = "全セット完遂 ✓ 次回は 2.5〜5kg 上げてOK";
    }

    // − / ＋ を押したときの重量の増減
    function adjustWeight(setIndex, direction) {
      const sets = draft.exercises[exIndex].sets;
      const before = Number(sets[setIndex].weight || 0);
      const step = stepFor(def.name);
      const after = Math.max(0, Math.round((before + direction * step) * 100) / 100);

      // まだ回数を入れていない後続セットが同じ重量なら、まとめて合わせる
      for (let j = setIndex + 1; j < sets.length; j++) {
        if (sets[j].reps === "" && Number(sets[j].weight || 0) === before) {
          sets[j].weight = String(after);
        }
      }
      sets[setIndex].weight = String(after);
      drawSets();
      updateHint();
      updateEstimate();
    }

    function drawSets() {
      setsBox.innerHTML = "";
      draft.exercises[exIndex].sets.forEach((set, setIndex) => {
        const row = document.createElement("div");
        row.className = "set";

        const no = document.createElement("span");
        no.className = "no";
        no.textContent = (setIndex + 1) + ".";
        row.appendChild(no);

        const minus = document.createElement("button");
        minus.className = "step-btn"; minus.textContent = "−";
        minus.onclick = () => adjustWeight(setIndex, -1);
        row.appendChild(minus);

        const wField = document.createElement("span");
        wField.className = "f w";
        const w = document.createElement("input");
        w.type = "number"; w.inputMode = "decimal"; w.step = "0.5"; w.min = "0";
        w.placeholder = "重量"; w.value = set.weight;
        w.oninput = () => { set.weight = w.value; updateEstimate(); };
        wField.appendChild(w);
        const wUnit = document.createElement("span");
        wUnit.className = "unit"; wUnit.textContent = "kg";
        wField.appendChild(wUnit);
        row.appendChild(wField);

        const plus = document.createElement("button");
        plus.className = "step-btn"; plus.textContent = "＋";
        plus.onclick = () => adjustWeight(setIndex, 1);
        row.appendChild(plus);

        const rField = document.createElement("span");
        rField.className = "f r";
        const r = document.createElement("input");
        r.type = "number"; r.inputMode = "numeric"; r.min = "0";
        r.placeholder = "回数"; r.value = set.reps;
        r.oninput = () => { set.reps = r.value; updateHint(); updateEstimate(); };
        rField.appendChild(r);
        const rUnit = document.createElement("span");
        rUnit.className = "unit"; rUnit.textContent = "回";
        rField.appendChild(rUnit);
        row.appendChild(rField);

        const del = document.createElement("button");
        del.className = "link"; del.textContent = "✕"; del.title = "このセットを削除";
        del.onclick = () => {
          draft.exercises[exIndex].sets.splice(setIndex, 1);
          drawSets(); updateHint(); updateEstimate();
        };
        row.appendChild(del);

        setsBox.appendChild(row);
      });

      const footer = document.createElement("div");
      footer.className = "row";

      const add = document.createElement("button");
      add.className = "link"; add.textContent = "＋ セットを追加";
      add.onclick = () => {
        const sets = draft.exercises[exIndex].sets;
        const lastSet = sets[sets.length - 1];
        sets.push({ weight: lastSet ? lastSet.weight : "", reps: "" });
        drawSets(); updateHint();
      };
      footer.appendChild(add);

      const pick = document.createElement("button");
      pick.className = "step-pick";
      pick.textContent = "刻み " + stepFor(def.name) + "kg";
      pick.title = "タップで切り替え";
      pick.onclick = () => { cycleStep(def.name); drawSets(); };
      footer.appendChild(pick);

      setsBox.appendChild(footer);
    }

    drawSets();
    updateEstimate();
    container.appendChild(card);
  });
}

document.getElementById("saveBtn").onclick = () => {
  // 回数が入っているセットだけを残す
  const exercises = draft.exercises
    .map(ex => ({
      name: ex.name,
      sets: ex.sets
        .filter(s => s.reps !== "" && Number(s.reps) > 0)
        .map(s => ({
          weight: s.weight === "" ? null : Number(s.weight),
          reps: Number(s.reps)
        }))
    }))
    .filter(ex => ex.sets.length > 0);

  if (exercises.length === 0) {
    alert("記録するセットがありません。回数を入力してください。");
    return;
  }

  const logs = loadLogs();
  logs.push({
    id: Date.now(),
    date: draft.date,
    menu: draft.menu,
    memo: draft.memo,
    exercises: exercises
  });
  saveLogs(logs);
  renderHome();
};

const modalNote    = document.getElementById("modalNote");

function openArtModal(def) {

}
function drawModal() {

}
function closeModal() {
  modal.hidden = true;
  modalExercise = null;
}
document.getElementById("modalClose").onclick = closeModal;
modal.onclick = e => { if (e.target === modal) closeModal(); };

// 選んだ画像を縮小してから localStorage に保存する（そのままだと容量を超える）
photoInput.onchange = () => {
  const file = photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 640;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

      const photos = loadPhotos();
      photos[modalExercise.name] = canvas.toDataURL("image/jpeg", 0.7);
      localStorage.setItem(DELETED_PHOTO_KEY,
        JSON.stringify(loadDeletedPhotos().filter(n => n !== modalExercise.name)));
      if (savePhotos(photos)) {
        drawModal();
        drawExercises();
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = ""; // 同じ写真を選び直せるようにリセット
};

photoDelete.onclick = () => {
  const photos = loadPhotos();
  markPhotoDeleted(modalExercise.name);
  delete photos[modalExercise.name];
  savePhotos(photos);
  drawModal();
  drawExercises();
};

// ===== 履歴画面 =======================================================
function renderHistory() {
  const container = document.getElementById("logList");
  container.innerHTML = "";
  const logs = sortedLogs();

  if (logs.length === 0) {
    container.innerHTML = '<p class="empty">まだ記録がありません。</p>';
  }

  for (const log of logs) {
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "log-head";
    head.innerHTML =
      '<b>' + formatDate(log.date) + ' メニュー' + log.menu + '</b>' +
      '<span class="muted" style="margin-left:auto">' + totalVolume(log.exercises).toLocaleString() + 'kg</span>';
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "log-body";
    body.innerHTML = log.exercises
      .map(ex => '<div><span class="n">' + ex.name + '</span> ' + formatSets(ex.sets) + '</div>')
      .join("");
    card.appendChild(body);

    if (log.memo) {
      const memo = document.createElement("div");
      memo.className = "muted";
      memo.style.marginTop = "8px";
      memo.textContent = "メモ：" + log.memo;
      card.appendChild(memo);
    }

    const del = document.createElement("button");
    del.className = "link";
    del.textContent = "この記録を削除";
    del.style.marginTop = "6px";
    del.onclick = () => {
      if (!confirm(formatDate(log.date) + " の記録を削除しますか？")) return;
      markDeleted(log.id);
      saveLogs(loadLogs().filter(l => l.id !== log.id));
      renderHistory();
    };
    card.appendChild(del);

    container.appendChild(card);
  }
  showScreen("history", "履歴");
}

// ===== 起動 ===========================================================
renderHome();
requestPersistentStorage();

// オフラインでも開けるようにする（file:// で開いた場合は登録できないので黙って諦める）
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
